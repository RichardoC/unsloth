name: Release Desktop App

on:
  workflow_dispatch:
    # Both version inputs are free text in the dispatch UI, and studio_version
    # alone decides the release tag, all nine asset filenames and the updater
    # manifest version together. Near-miss tags are the failure mode worth
    # guarding, because they look right at a glance:
    #
    #   studio_version   v0.1.52-beta     correct
    #                    v.0.1.52-beta    rejected: stray dot after the leading v
    #                    0.1.52-beta      rejected: missing leading v
    #                    2026.8.3         rejected: that is the PyPI version
    #
    #   pypi_version     2026.8.3         correct, no leading v
    #
    # "Validate release versions" below rejects each of those by name before any
    # binary is built. Keep the examples here, in the descriptions, and in that
    # step's error messages on the same version so they cannot drift apart.
    inputs:
      studio_version:
        description: 'Unsloth SemVer tag to release, leading v with no dot after it (for example, v0.1.52-beta)'
        type: string
        required: true
      pypi_version:
        description: 'Exact PyPI unsloth version just published/stamped, no leading v (for example, 2026.8.3); leave blank to use MIN_DESKTOP_BACKEND_VERSION'
        type: string
        required: false
      draft:
        description: 'Build and validate only; nothing is uploaded to the v... release and GitHub latest is left untouched'
        type: boolean
        default: true

permissions:
  contents: read

env:
  DESKTOP_RELEASE_NOTES: |
    Desktop app for Unsloth.

    **macOS**: Download the Apple Silicon `.dmg`.
    **Windows**: Download the `-setup.exe` installer.
    **Linux**: Download `.deb` for Ubuntu/Debian. `.AppImage` is experimental.

    > Linux in-app updates are AppImage-oriented. Package installs should update by downloading a new package.
    > Linux AppImage can show a blank window on some Tauri/WebKitGTK + Wayland/Mesa stacks; use `.deb` when available.
    > Linux AppImage on Ubuntu 24.04+ may require: `sudo apt install libfuse2t64`
    > First-run system dependency elevation is supported on Ubuntu/Debian. Other Linux distributions should install system packages manually.

concurrency:
  group: release-desktop-${{ github.repository }}
  cancel-in-progress: false
  # publish-desktop-updater.yml shares this group and already sets queue: max.
  # Without it here, the default queue: single silently cancels a *pending*
  # release the moment a second one is dispatched or a publish lands, which
  # looks identical to a release that was never dispatched. A queued release
  # holds no runner, so waiting is free.
  queue: max

jobs:
  # There is no capacity-sweeper dispatch here. It used to ask ci-capacity.yml to
  # stand scheduled CI down while a release built, but that workflow is inert
  # unless the repo variable CI_PREEMPT_ENABLED is the exact string 'true', so
  # every release spent a runner on a job that resolved what it would have
  # cancelled and then touched nothing. Queue clearing is done by hand now.
  prepare-version:
    name: Prepare release versions
    runs-on: ubuntu-latest
    # Version resolution only; observed 8-16s.
    timeout-minutes: 15
    outputs:
      studio_version: ${{ steps.prepare.outputs.studio_version }}
      app_version: ${{ steps.prepare.outputs.app_version }}
      asset_version: ${{ steps.prepare.outputs.asset_version }}
      desktop_release_tag: ${{ steps.prepare.outputs.desktop_release_tag }}
      pypi_version: ${{ steps.backend.outputs.pypi_version }}

    steps:
      # Before the checkout: for a malformed studio_version, actions/checkout would
      # fail on the ref with a generic error and none of the corrections below
      # would ever be printed.
      - name: Validate release versions
        id: prepare
        shell: bash
        env:
          INPUT_STUDIO_VERSION: ${{ inputs.studio_version }}
          # Reading releases unauthenticated spends a quota shared by every runner.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.request

          RELEASES_API_URL = (
              'https://api.github.com/repos/unslothai/unsloth/releases?per_page=30'
          )

          studio_version = os.environ['INPUT_STUDIO_VERSION'].strip()
          if not studio_version:
              sys.exit('studio_version is required, for example v0.1.52-beta')
          if re.fullmatch(r'v?20\d{2}\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?', studio_version):
              sys.exit(f'studio_version must be an Unsloth SemVer tag, not a date-style backend version: {studio_version}')

          # Name the single wrong character for the near-miss shapes. The generic
          # SemVer error below is easy to skim past when everything except one
          # separator looks correct, so spell out the correction instead.
          separator_after_v = re.fullmatch(r'v[._\-](\d[0-9A-Za-z.\-+]*)', studio_version)
          if separator_after_v:
              suggestion = f'v{separator_after_v.group(1)}'
              sys.exit(
                  'studio_version must not have a separator after the leading v: '
                  f'{studio_version} (did you mean {suggestion}?)'
              )

          semver_tag = re.compile(
              r'^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)'
              r'(?:-[0-9A-Za-z.][0-9A-Za-z.-]*)?$'
          )
          if semver_tag.fullmatch(f'v{studio_version}'):
              sys.exit(f'studio_version must start with v, for example v{studio_version}')
          if not semver_tag.fullmatch(studio_version):
              sys.exit(f'studio_version must be a SemVer tag with leading v, for example v0.1.52-beta: {studio_version}')

          app_version = studio_version.removeprefix('v')
          asset_version = re.sub(r'[^0-9A-Za-z]+', '_', app_version).strip('_')
          desktop_release_tag = studio_version

          # Both updater paths compare SemVer, so a tag whose numbers go backwards
          # strands its own clients: 60 < 527, so v0.1.60-beta offered no one.
          def semver_key(version):
              # Full precedence, not just the triple: v0.1.528 and v0.1.528-rc
              # both beat v0.1.528-beta, and the updater knows it.
              version = version.strip().removeprefix('v')
              match = semver_tag.fullmatch(f'v{version}')
              if not match:
                  return None
              release = tuple(int(part) for part in match.groups())
              pre = version.partition('-')[2]
              if not pre:
                  return release, (1,)  # a release outranks its own prereleases
              # SemVer: numeric identifiers sort below alphanumeric, as numbers.
              return release, (0, *(
                  (0, int(part), '') if part.isdigit() else (1, 0, part)
                  for part in pre.split('.')
              ))

          def fetch(url):
              headers = {'Accept': 'application/vnd.github+json'}
              token = os.environ.get('GH_TOKEN', '')
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers = headers), timeout = 30
              ) as response:
                  return json.loads(response.read())

          def published_desktop_version():
              # Not /releases/latest: an llama.cpp prebuilt can hold that slot
              # and ships no manifest, so the read would 404 and skip this check.
              studio = [
                  release for release in fetch(RELEASES_API_URL)
                  if not release['draft'] and semver_tag.fullmatch(release['tag_name'])
              ]
              studio.sort(key = lambda release: release['published_at'], reverse = True)
              for release in studio:
                  for asset in release['assets']:
                      if asset['name'] == 'latest.json':
                          return fetch(asset['browser_download_url']).get('version', '')
              return ''

          try:
              published = published_desktop_version()
          except (OSError, ValueError, KeyError) as error:
              # An unreachable manifest is not a bad tag, and the first has none.
              print(f'::warning::could not read the published desktop version: {error}')
              published = ''

          published_key = semver_key(published)
          if published_key and published_key >= semver_key(app_version):
              sys.exit(
                  f'studio_version {studio_version} is not newer than the published '
                  f'v{published}, so clients on it would never be offered this release'
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'studio_version={studio_version}', file=output)
              print(f'app_version={app_version}', file=output)
              print(f'asset_version={asset_version}', file=output)
              print(f'desktop_release_tag={desktop_release_tag}', file=output)

          PY

      # studio_version names an existing tag, so the backend pin and the stamp
      # check have to come from that tag, not a dispatch ref that has moved on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.studio_version }}
          persist-credentials: false

      - name: Resolve the backend pin from the release tag
        id: backend
        shell: bash
        env:
          INPUT_PYPI_VERSION: ${{ inputs.pypi_version }}
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          def parse_backend_version(version):
              match = re.fullmatch(
                  r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)'
                  r'(?:([a-zA-Z]|\.dev|dev|\.rc|rc|\.post|post)(\d*))?'
                  r'(?:[-+]([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?',
                  version,
              )
              if not match:
                  return None
              major, minor, patch, suffix_name, suffix_number, suffix_text = match.groups()
              if suffix_name:
                  normalized = suffix_name.lower().lstrip('.')
                  order = {'dev': 0, 'a': 1, 'b': 2, 'rc': 3, 'post': 5}.get(normalized)
                  if order is None:
                      return None
                  number = int(suffix_number or '0')
              elif suffix_text:
                  order = 3 if version[version.find(suffix_text) - 1] == '-' else 4
                  number = 0
              else:
                  order = 4
                  number = 0
              return (int(major), int(minor), int(patch), order, number)

          preflight = pathlib.Path('studio/src-tauri/src/preflight/version.rs').read_text()
          match = re.search(r'MIN_DESKTOP_BACKEND_VERSION:\s*&str\s*=\s*"([^"]+)"', preflight)
          if not match:
              sys.exit('Could not read MIN_DESKTOP_BACKEND_VERSION')
          min_backend_version = match.group(1)

          input_pypi_version = os.environ.get('INPUT_PYPI_VERSION', '').strip()
          parsed_min_backend = parse_backend_version(min_backend_version)
          if parsed_min_backend is None:
              sys.exit(f'MIN_DESKTOP_BACKEND_VERSION is not a supported backend package version: {min_backend_version}')

          pypi_version = input_pypi_version or min_backend_version
          parsed_pypi = parse_backend_version(pypi_version)
          if parsed_pypi is None:
              sys.exit(f'pypi_version is not a supported backend package version: {pypi_version}')
          if parsed_pypi < parsed_min_backend:
              sys.exit(
                  f'pypi_version {pypi_version} is lower than desktop minimum '
                  f'MIN_DESKTOP_BACKEND_VERSION {min_backend_version}'
              )

          if input_pypi_version:
              print(
                  'Using exact PyPI unsloth version from pypi_version input: '
                  f'{pypi_version} (desktop minimum: {min_backend_version})'
              )
          else:
              print(
                  'Using exact PyPI unsloth version from MIN_DESKTOP_BACKEND_VERSION: '
                  f'{pypi_version}'
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'pypi_version={pypi_version}', file=output)

          PY

      # Fail before building and notarizing a version publish-release will reject.
      - name: Guard against republishing an existing version
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_TAG: ${{ steps.prepare.outputs.desktop_release_tag }}
          ASSET_VERSION: ${{ steps.prepare.outputs.asset_version }}
        run: |
          set -euo pipefail
          # v{version} is tagged and published when main is tagged, before this runs,
          # so the tag existing is normal. What must be absent is the desktop asset set.
          if ! response="$(gh api --include "repos/${GH_REPO}/releases/tags/${DESKTOP_RELEASE_TAG}" 2>&1)"; then
            if [[ "$response" =~ ^HTTP/[0-9.]+\ 404\  ]]; then
              echo "Release ${DESKTOP_RELEASE_TAG} does not exist." >&2
              echo "  Tag main and publish it first, then re-dispatch this workflow." >&2
              exit 1
            fi
            echo "Could not read release ${DESKTOP_RELEASE_TAG}; refusing to publish." >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          gh api "repos/${GH_REPO}/releases/tags/${DESKTOP_RELEASE_TAG}" > "$RUNNER_TEMP/target-release.json"
          # A carried-forward manifest for an older version is expected here (see
          # publish-desktop-updater.yml), so read it rather than judge by name alone.
          mkdir -p "$RUNNER_TEMP/target-manifest"
          gh release download "$DESKTOP_RELEASE_TAG" --pattern latest.json \
            --dir "$RUNNER_TEMP/target-manifest" --clobber 2>/dev/null || true
          python3 <<'PY'
          import json, os, pathlib, sys

          runner = pathlib.Path(os.environ['RUNNER_TEMP'])
          release = json.loads((runner / 'target-release.json').read_text())
          tag = os.environ['DESKTOP_RELEASE_TAG']
          # Checked here, not at promotion: GitHub refuses to mark a prerelease
          # latest, and by then the bundles are already public.
          if release.get('prerelease'):
              sys.exit(f'Release {tag} is a prerelease; GitHub cannot mark it latest.')

          prefix = f'Unsloth-Desktop-{os.environ["ASSET_VERSION"]}'
          clashing = sorted(
              asset['name']
              for asset in release.get('assets', [])
              if str(asset.get('name', '')).startswith(prefix)
          )
          manifest_path = runner / 'target-manifest' / 'latest.json'
          if manifest_path.is_file():
              try:
                  version = json.loads(manifest_path.read_text()).get('version')
              except json.JSONDecodeError:
                  version = None
              # Only this version's own manifest is a clash; anything else is the
              # pointer being carried forward and is overwritten on upload.
              if not isinstance(version, str) or version.removeprefix('v') == tag.removeprefix('v'):
                  clashing.append('latest.json')

          if clashing:
              print(f'Refusing to republish {tag}: it already carries desktop assets.', file=sys.stderr)
              for name in clashing:
                  print(f'  gh release delete-asset {tag} {name} --yes', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify PyPI package and Unsloth stamp
        shell: bash
        env:
          STUDIO_VERSION: ${{ steps.prepare.outputs.studio_version }}
          PYPI_VERSION: ${{ steps.prepare.outputs.pypi_version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          pypi_version = os.environ['PYPI_VERSION']
          dist_dir = pathlib.Path(os.environ['RUNNER_TEMP'], 'pypi-unsloth-dist')
          dist_dir.mkdir(parents=True, exist_ok=True)
          metadata_url = f'https://pypi.org/pypi/unsloth/{pypi_version}/json'

          last_error = None
          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(metadata_url, timeout=30) as response:
                      metadata = json.load(response)
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt < 5:
                      time.sleep(10 * attempt)
          else:
              sys.exit(f'Publish unsloth=={pypi_version} to PyPI before the desktop release ({last_error})')

          files = metadata.get('urls') or []
          if not files:
              sys.exit(f'PyPI returned no distribution files for unsloth=={pypi_version}')

          for file_info in files:
              filename = file_info.get('filename')
              url = file_info.get('url')
              if not filename or '/' in filename or not url:
                  sys.exit(f'Unexpected PyPI file entry for unsloth=={pypi_version}: {file_info!r}')
              target = dist_dir / filename
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as response:
                          target.write_bytes(response.read())
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 3:
                          time.sleep(5 * attempt)
              else:
                  sys.exit(f'Could not download {filename} from PyPI ({last_error})')
          PY

          if [ "$GITHUB_REPOSITORY" = "wasimysaid/unsloth" ]; then
            echo "Fork-only updater A/B build: skipping the upstream PyPI-to-Studio release stamp check."
          elif [ -f scripts/stamp_studio_release.py ]; then
            mapfile -t dists < <(find "$RUNNER_TEMP/pypi-unsloth-dist" -type f \( -name '*.whl' -o -name '*.tar.gz' \) | sort)
            if [ "${#dists[@]}" -eq 0 ]; then
              echo "No PyPI wheel/sdist artifacts downloaded for unsloth==$PYPI_VERSION" >&2
              exit 1
            fi
            python3 scripts/stamp_studio_release.py --verify-dist "$RUNNER_TEMP/pypi-unsloth-dist" --expected "$STUDIO_VERSION"
          else
            echo "scripts/stamp_studio_release.py not found; release-desktop requires #5308 to verify the PyPI Unsloth stamp." >&2
            exit 1
          fi

      - name: Guard GitHub latest release version
        if: ${{ !inputs.draft }}
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          current_file="$RUNNER_TEMP/current-latest-release.json"
          error_file="$RUNNER_TEMP/current-latest-release.err"
          if ! gh api "repos/${GH_REPO}/releases/latest" > "$current_file" 2> "$error_file"; then
            if grep -Fq '(HTTP 404)' "$error_file"; then
              echo "No existing normal GitHub release found; allowing first latest release."
              exit 0
            fi
            cat "$error_file" >&2
            exit 1
          fi
          python3 - "$current_file" <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          def parse(value: str):
              value = value.removeprefix('v')
              match = re.fullmatch(
                  r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)'
                  r'(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
                  r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?',
                  value,
              )
              if not match:
                  sys.exit(f'GitHub latest release is not a desktop SemVer tag: {value}')
              major, minor, patch, prerelease = match.groups()
              return (int(major), int(minor), int(patch), prerelease)

          def compare_identifier(left: str, right: str) -> int:
              if left.isdigit() and right.isdigit():
                  return (int(left) > int(right)) - (int(left) < int(right))
              if left.isdigit():
                  return -1
              if right.isdigit():
                  return 1
              left_tail = re.fullmatch(r'([A-Za-z-]+)(\d+)', left)
              right_tail = re.fullmatch(r'([A-Za-z-]+)(\d+)', right)
              if left_tail and right_tail and left_tail.group(1).lower() == right_tail.group(1).lower():
                  return (int(left_tail.group(2)) > int(right_tail.group(2))) - (
                      int(left_tail.group(2)) < int(right_tail.group(2))
                  )
              return (left > right) - (left < right)

          def compare(left: str, right: str) -> int:
              left_major, left_minor, left_patch, left_pre = parse(left)
              right_major, right_minor, right_patch, right_pre = parse(right)
              left_core = (left_major, left_minor, left_patch)
              right_core = (right_major, right_minor, right_patch)
              if left_core != right_core:
                  return (left_core > right_core) - (left_core < right_core)
              if left_pre == right_pre:
                  return 0
              if left_pre is None:
                  return 1
              if right_pre is None:
                  return -1
              for left_part, right_part in zip(left_pre.split('.'), right_pre.split('.')):
                  order = compare_identifier(left_part, right_part)
                  if order:
                      return order
              return (len(left_pre.split('.')) > len(right_pre.split('.'))) - (
                  len(left_pre.split('.')) < len(right_pre.split('.'))
              )

          current = json.loads(pathlib.Path(sys.argv[1]).read_text())
          current_tag = current.get('tag_name')
          if not isinstance(current_tag, str):
              sys.exit('GitHub latest release is missing tag_name')
          next_version = os.environ['APP_VERSION']
          if compare(next_version, current_tag) < 0:
              sys.exit(f'Refusing to publish {next_version}; GitHub latest is newer: {current_tag}.')
          PY

  build:
    strategy:
      fail-fast: false
      # Legs run in parallel: they share no state, only upload per-platform
      # artifacts, and publish-release does every release mutation once.
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS (Apple Silicon)
            artifact: macos-aarch64
            # The macOS leg stopped being comparable to the other two when the
            # bundled runtime landed. On top of the Rust compile it downloads and
            # hash-verifies a ~2.5 GiB payload, signs its ~700 Mach-O files one
            # timestamped signature at a time (each one a round trip to Apple's
            # timestamp service), rewrites a multi-gigabyte disk image twice, and
            # notarizes the result. desktop-dev-build.yml budgets 90 minutes for
            # the payload and the build ALONE, with no signing and no
            # notarization, so 60 here would fail every release.
            timeout_minutes: 180
          # - platform: macos-latest
          #   args: '--target x86_64-apple-darwin'
          #   label: macOS (Intel)
          - platform: ubuntu-22.04
            args: ''
            label: Linux (x64)
            artifact: linux-x64
            timeout_minutes: 60
          - platform: windows-latest
            args: ''
            label: Windows (x64)
            artifact: windows-x64
            timeout_minutes: 60

    name: Build ${{ matrix.label }}
    needs: prepare-version
    runs-on: ${{ matrix.platform }}
    # Per leg, not one number for all three: 6.9-20.9 min was observed across
    # platforms before the bundled runtime, and Linux and Windows still are that.
    # Only macOS grew, and a shared cap would have to be the macOS one -- which
    # would let a hung Windows signing step burn three hours instead of one.
    timeout-minutes: ${{ matrix.timeout_minutes }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APP_VERSION: ${{ needs.prepare-version.outputs.app_version }}
      ASSET_VERSION: ${{ needs.prepare-version.outputs.asset_version }}
      STUDIO_VERSION: ${{ needs.prepare-version.outputs.studio_version }}
      DESKTOP_RELEASE_TAG: ${{ needs.prepare-version.outputs.desktop_release_tag }}
      # Compiled in by preflight/version.rs. Without it the app only knows the
      # floor, so a shared venv left by the CLI installer is never upgraded again.
      UNSLOTH_DESKTOP_BACKEND_VERSION: ${{ needs.prepare-version.outputs.pypi_version }}

    steps:
      # harden-runner in audit mode: surfaces every egress destination in
      # the runner log so the allowlist for a future `egress-policy: block`
      # promotion can be derived from observed traffic. Blocking mode is
      # supported on GitHub-hosted Linux / macOS / Windows runners as of
      # harden-runner v2.20.0; stay in audit until the macOS + Windows
      # codesign paths have been observed.
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # The tag, not the dispatch ref: the release is published before this runs and
      # main keeps moving, so building the dispatch ref would attach unrelated source
      # to the release and record a SHA that is not the tag's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.desktop_release_tag }}
          persist-credentials: false

      # SOURCE_DATE_EPOCH is the tag commit's committer timestamp, so it is a
      # property of the source rather than of the runner clock. It cannot live
      # in the job-level `env:` block, which is evaluated before the checkout
      # exists, so it is exported into the job environment here and every later
      # step in this job sees it.
      #
      # This is groundwork, not a reproducibility claim: nothing in this
      # workflow verifies that two builds of the same tag produce identical
      # bytes, and whether tauri-bundler honours SOURCE_DATE_EPOCH for the
      # timestamps it stamps into deb/NSIS/dmg payloads is unconfirmed. What it
      # does today is remove the wall clock from any tool that already respects
      # the convention, and record the value in build-inputs.json so a future
      # rebuild can be attempted with the same input.
      - name: Export SOURCE_DATE_EPOCH from the tag commit
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          case "$epoch" in
            ''|*[!0-9]*)
              echo "git log did not return a numeric committer timestamp: '$epoch'" >&2
              exit 1
              ;;
          esac
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch ($(date -u -d "@$epoch" 2>/dev/null || true))"

      # ── Linux dependencies ──
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Exact, not `24`. A major-only request resolves to whatever 24.x the
          # setup-node manifest holds that day, so the Node that runs `vite
          # build` and the Tauri CLI was a floating input of the release. There
          # is no .nvmrc convention in this repo (every other workflow names the
          # version inline), so the pin lives here and is recorded in
          # build-inputs.json alongside the toolchain it built with.
          node-version: '24.19.0'

      - name: Install pinned Tauri CLI
        # `npm ci`, not `npm install`: studio/package.json exists only to hold
        # this lockfile ("Lockfile holder for @tauri-apps/cli", see its
        # description), and @tauri-apps/cli 2.10.1 is already pinned in its
        # devDependencies and resolved in studio/package-lock.json. `npm install
        # --save-dev @tauri-apps/cli@2.10.1` re-resolved the transitive tree on
        # every run and could rewrite the lockfile in the working tree; `npm ci`
        # installs exactly what the lockfile says and fails if the two disagree.
        # Lifecycle scripts (esbuild native-binary postinstall, etc.) are
        # required for `vite build`. The pre-install lockfile structural
        # audit (lockfile_supply_chain_audit.py) is the practical defence
        # against the npm postinstall-dropper class -- it fires BEFORE any
        # tarball runs, on the injection pattern itself rather than an
        # advisory-DB lookup.
        run: npm ci --prefix studio --no-fund --no-audit

      - name: Verify pinned Tauri CLI
        shell: bash
        run: |
          out="$(npx --prefix studio tauri --version)"
          echo "$out"
          if [ "$out" != "tauri-cli 2.10.1" ]; then
            echo "Expected tauri-cli 2.10.1, got $out" >&2
            exit 1
          fi

      - name: Verify desktop updater and Linux package config
        shell: bash
        run: |
          node <<'JS'
          const { readFileSync } = require('node:fs');

          const expected = 'https://github.com/unslothai/unsloth/releases/latest/download/latest.json';
          const config = JSON.parse(readFileSync('studio/src-tauri/tauri.conf.json', 'utf8'));
          const endpoints = config.plugins?.updater?.endpoints;
          if (!Array.isArray(endpoints) || endpoints.length !== 1) {
            throw new Error('Expected exactly one desktop updater endpoint');
          }
          if (endpoints[0] !== expected) {
            throw new Error('Desktop updater endpoint must be ' + expected + ', got ' + endpoints[0]);
          }
          if (!endpoints[0].includes('/releases/latest/download/latest.json')) {
            throw new Error('Desktop updater endpoint must use repo-wide /releases/latest/ discovery');
          }

          const targets = config.bundle?.targets;
          if (Array.isArray(targets) && targets.some((target) => String(target).toLowerCase() === 'rpm')) {
            throw new Error('Desktop release must not target RPM packages');
          }
          if (Array.isArray(targets) && targets.some((target) => String(target).toLowerCase() === 'appimage')) {
            throw new Error('Tauri AppImage bundling must stay disabled; the release uses the thin AppImage packager');
          }
          if (config.bundle?.linux?.rpm) {
            throw new Error('bundle.linux.rpm must not be configured');
          }
          if (config.bundle?.linux?.appimage) {
            throw new Error('bundle.linux.appimage must not be configured for the thin AppImage release path');
          }

          const workflow = readFileSync('.github/workflows/release-desktop.yml', 'utf8');
          const lines = workflow.split(/\r?\n/);
          const linuxInstallLines = lines.filter((line) => line.includes('sudo apt-get install'));
          const ayatanaPackage = ['libayatana', 'appindicator3-dev'].join('-');
          if (linuxInstallLines.some((line) => line.includes(ayatanaPackage))) {
            throw new Error('Desktop Linux release must not install the Ayatana appindicator dev package');
          }
          if (!linuxInstallLines.some((line) => line.includes('libappindicator3-dev'))) {
            throw new Error('Desktop Linux release must install libappindicator3-dev');
          }
          const appimagetoolLines = lines.filter((line) => line.includes('github.com/AppImage/appimagetool/releases/download'));
          if (!appimagetoolLines.some((line) => line.includes('1.9.1/appimagetool-x86_64.AppImage'))) {
            throw new Error('Desktop Linux release must pin appimagetool 1.9.1');
          }
          // A pinned version/path is reproducibility, not integrity: the asset
          // can be replaced after upload. Require the immutable SHA-256 digest
          // to be pinned AND verified before chmod +x. Scope every check to the
          // real "Pin thin AppImage toolchain" step so this guard cannot
          // satisfy itself; a file-wide scan would match the guard's own code.
          const expectedAppimagetoolDigest = 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0';
          const expectedRuntimeDigest = '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d';
          const isComment = (line) => {
            const trimmed = line.trim();
            return trimmed.startsWith('#') || trimmed.startsWith('//');
          };
          const stepStart = lines.findIndex((line) => /^\s*- name: Pin thin AppImage toolchain\s*$/.test(line));
          if (stepStart === -1) {
            throw new Error('Desktop Linux release must keep the "Pin thin AppImage toolchain" step');
          }
          const stepIndent = lines[stepStart].search(/\S/);
          let stepEnd = lines.length;
          for (let i = stepStart + 1; i < lines.length; i += 1) {
            const line = lines[i];
            if (line.trim() === '') continue;
            const indent = line.search(/\S/);
            // The next sibling step ('- ...') at the same indent, or any dedent
            // below the step, ends this step's block.
            if (indent < stepIndent || (indent === stepIndent && /^\s*-\s/.test(line))) {
              stepEnd = i;
              break;
            }
          }
          const stepLines = lines.slice(stepStart, stepEnd);
          const digest = (name) => {
            const pattern = new RegExp(`^\\s*${name}:\\s*["']([0-9a-f]{64})["']\\s*$`);
            const line = stepLines.find((candidate) => pattern.test(candidate));
            return line?.match(pattern)?.[1];
          };
          if (digest('APPIMAGETOOL_SHA256') !== expectedAppimagetoolDigest) {
            throw new Error('Desktop Linux release must pin the appimagetool SHA-256 digest');
          }
          if (digest('APPIMAGE_RUNTIME_SHA256') !== expectedRuntimeDigest) {
            throw new Error('Desktop Linux release must pin the AppImage runtime SHA-256 digest');
          }
          const sha256Indexes = stepLines
            .map((line, index) => !isComment(line) && line.includes('sha256sum -c') ? index : -1)
            .filter((index) => index !== -1);
          if (sha256Indexes.length !== 2) {
            throw new Error('Desktop Linux release must verify both AppImage toolchain digests');
          }
          const chmodIdx = stepLines.findIndex((line) => !isComment(line) && /chmod\s+\+x/.test(line));
          if (chmodIdx !== -1 && Math.max(...sha256Indexes) > chmodIdx) {
            throw new Error('Desktop Linux release must verify the AppImage toolchain before chmod +x');
          }

          // ── The WebView2 bootstrapper the NSIS installer embeds ──
          // Same shape as the AppImage toolchain check above: the mode has to
          // stay the one the pin was designed for, the digest has to be pinned in
          // every step that claims to, and the download has to be verified before
          // the file reaches the path tauri-bundler treats as "already cached".
          const expectedWebview2Digest = 'be695eb3732a94e181f008ab5cf6ee650f8644676e87f9e02b6ab0d02f2ea08e';
          const webviewMode = config.bundle?.windows?.webviewInstallMode;
          if (webviewMode?.type !== 'embedBootstrapper') {
            throw new Error(
              'bundle.windows.webviewInstallMode must stay {type: embedBootstrapper}; the release '
              + 'pins the bootstrapper bytes and proves the installer embedded them. '
              + 'downloadBootstrapper moves the unverified fetch to the user\'s machine and '
              + 'fixedRuntime pins the WebView2 runtime version, cutting users off from Evergreen '
              + 'security updates. Got: ' + JSON.stringify(webviewMode)
            );
          }
          const windowsOverride = JSON.parse(readFileSync('studio/src-tauri/tauri.windows.conf.json', 'utf8'));
          if (windowsOverride.bundle?.windows?.webviewInstallMode !== undefined) {
            throw new Error(
              'tauri.windows.conf.json must not override bundle.windows.webviewInstallMode; the '
              + 'Windows leg merges it over tauri.conf.json, so an override here would silently '
              + 'defeat the check above'
            );
          }
          const stepBlock = (name) => {
            const start = lines.findIndex((line) => new RegExp(`^\\s*- name: ${name}\\s*$`).test(line));
            if (start === -1) {
              throw new Error(`Desktop Windows release must keep the "${name}" step`);
            }
            const indent = lines[start].search(/\S/);
            let end = lines.length;
            for (let i = start + 1; i < lines.length; i += 1) {
              if (lines[i].trim() === '') continue;
              const lineIndent = lines[i].search(/\S/);
              if (lineIndent < indent || (lineIndent === indent && /^\s*-\s/.test(lines[i]))) {
                end = i;
                break;
              }
            }
            return lines.slice(start, end);
          };
          const digestIn = (block, name) => {
            const pattern = new RegExp(`^\\s*${name}:\\s*["']([0-9a-f]{64})["']\\s*$`);
            const line = block.find((candidate) => pattern.test(candidate));
            return line?.match(pattern)?.[1];
          };
          const webviewPinLines = stepBlock('Pin Windows WebView2 bootstrapper');
          const webviewVerifyLines = stepBlock('Verify the embedded WebView2 bootstrapper');
          for (const [label, block] of [['pin', webviewPinLines], ['verify', webviewVerifyLines]]) {
            if (digestIn(block, 'WEBVIEW2_BOOTSTRAPPER_SHA256') !== expectedWebview2Digest) {
              throw new Error(
                `Desktop Windows release must pin the WebView2 bootstrapper SHA-256 digest in the ${label} step, `
                + 'and both steps must pin the same one'
              );
            }
          }
          const webviewUrl = webviewPinLines.find((line) => /^\s*WEBVIEW2_BOOTSTRAPPER_URL:/.test(line));
          if (!webviewUrl || !/msedge\.sf\.dl\.delivery\.mp\.microsoft\.com\/filestreamingservice\/files\/[0-9a-f-]{36}\/MicrosoftEdgeWebview2Setup\.exe/.test(webviewUrl)) {
            throw new Error(
              'Desktop Windows release must pin the WebView2 bootstrapper to the immutable '
              + 'per-version download URL, not the rotating go.microsoft.com/fwlink redirect'
            );
          }
          const hashIdx = webviewPinLines.findIndex((line) => !isComment(line) && /Get-FileHash/.test(line));
          const seedIdx = webviewPinLines.findIndex((line) => !isComment(line) && /Move-Item/.test(line));
          if (hashIdx === -1 || seedIdx === -1 || hashIdx > seedIdx) {
            throw new Error(
              'Desktop Windows release must verify the WebView2 bootstrapper digest before moving it '
              + 'into the tauri-bundler tools directory'
            );
          }
          if (!webviewPinLines.some((line) => !isComment(line) && /exit 1/.test(line))) {
            throw new Error('The WebView2 bootstrapper digest check must fail closed');
          }
          if (!webviewVerifyLines.some((line) => !isComment(line) && /WEBVIEW2BOOTSTRAPPERPATH/.test(line))) {
            throw new Error(
              'Desktop Windows release must read WEBVIEW2BOOTSTRAPPERPATH back out of the rendered '
              + 'NSIS script, so the check covers what the installer embedded rather than what the '
              + 'pin step intended'
            );
          }
          const buildIdx = lines.findIndex((line) => /^\s*- name: Build Windows app\s*$/.test(line));
          const pinIdx = lines.findIndex((line) => /^\s*- name: Pin Windows WebView2 bootstrapper\s*$/.test(line));
          const verifyIdx = lines.findIndex((line) => /^\s*- name: Verify the embedded WebView2 bootstrapper\s*$/.test(line));
          if (!(pinIdx < buildIdx && buildIdx < verifyIdx)) {
            throw new Error(
              'The WebView2 bootstrapper must be pinned before the Windows build and verified after it'
            );
          }

          // ── The macOS bundled runtime, and the order that makes it signable ──
          // Same shape as the two pins above: the invariant is checked against the
          // real steps rather than trusted to a comment. Here the invariant is an
          // ORDER, because getting it wrong does not fail loudly -- it produces a
          // .dmg that Gatekeeper rejects on a user's machine, or an updater
          // payload that macOS refuses to launch, days after the release.
          const macosLegSteps = [
            'Check the macOS bundle lock is not stale',
            'Assemble the bundled runtime payload',
            'Locate the built macOS bundle',
            'Inject the bundled runtime into the macOS app',
            'Sign the bundled runtime and the macOS app',
            'Verify every Mach-O in the macOS bundle is signed',
            'Rebuild the macOS updater artifact from the signed app',
            'Rebuild the macOS disk image around the signed app',
          ];
          const stepIndex = (name) => {
            const index = lines.findIndex((line) => new RegExp(`^\\s*- name: ${name}\\s*$`).test(line));
            if (index === -1) {
              throw new Error(`The macOS release leg must keep the "${name}" step`);
            }
            return index;
          };
          const order = [
            'Check the macOS bundle lock is not stale',
            'Assemble the bundled runtime payload',
            'Build macOS app',
            'Locate the built macOS bundle',
            'Inject the bundled runtime into the macOS app',
            'Sign the bundled runtime and the macOS app',
            'Verify every Mach-O in the macOS bundle is signed',
            'Rebuild the macOS updater artifact from the signed app',
            'Rebuild the macOS disk image around the signed app',
            'Notarize final macOS disk image',
          ];
          for (let i = 1; i < order.length; i += 1) {
            if (stepIndex(order[i - 1]) >= stepIndex(order[i])) {
              throw new Error(
                `The macOS release leg must run "${order[i - 1]}" before "${order[i]}". `
                + 'The payload cannot be injected into a signed bundle (that invalidates the '
                + 'signature), the disk image cannot be rebuilt before the app it contains is '
                + 'signed, and notarization cannot run before the image is rebuilt.'
              );
            }
          }
          for (const name of macosLegSteps) {
            const block = stepBlock(name);
            if (!block.some((line) => /^\s*if:\s*matrix\.platform == 'macos-latest'\s*$/.test(line))) {
              throw new Error(`"${name}" must be gated on the macOS leg`);
            }
          }

          // tauri-action must not be handed a signing identity. If it signs the
          // app, the injection that follows invalidates that signature, and
          // scripts/inject_macos_runtime.sh would refuse to run at all.
          const macosBuildBlock = stepBlock('Build macOS app');
          for (const secret of ['APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID']) {
            if (macosBuildBlock.some((line) => new RegExp(`^\\s*${secret}:`).test(line))) {
              throw new Error(
                `"Build macOS app" must not receive ${secret}: tauri signs the app before the `
                + 'bundled runtime is injected, and injecting into a signed bundle invalidates '
                + 'the signature. Signing happens after the injection instead.'
              );
            }
          }

          // The injection must not touch the disk image tauri built: that image is
          // rebuilt around the SIGNED app further down, so adding the payload to
          // it here would only produce an image whose app is unsigned.
          const injectBlock = stepBlock('Inject the bundled runtime into the macOS app');
          if (!injectBlock.some((line) => line.includes('scripts/inject_macos_runtime.sh'))) {
            throw new Error('The injection step must use scripts/inject_macos_runtime.sh');
          }
          if (injectBlock.some((line) => !isComment(line) && /--dmg\b/.test(line))) {
            throw new Error(
              'The macOS release leg must not inject into tauri\'s disk image; the image is '
              + 'rebuilt around the signed app instead'
            );
          }

          // What the signature has to be. --options runtime and --timestamp are
          // both notarization requirements, and --deep is not a substitute for
          // signing the payload: it walks nested bundles, not files sitting in
          // Contents/Resources, so it would report success over ~700 unsigned
          // Mach-Os.
          const signBlock = stepBlock('Sign the bundled runtime and the macOS app');
          for (const flag of ['--options runtime', '--timestamp']) {
            if (!signBlock.some((line) => !isComment(line) && line.includes(flag))) {
              throw new Error(`The macOS signing step must pass ${flag}`);
            }
          }
          if (signBlock.some((line) => !isComment(line) && /codesign[^\n]*--deep/.test(line))) {
            throw new Error(
              'codesign --deep must not sign the bundled runtime: it does not reach Mach-O '
              + 'files stored as resources, so it would leave the payload unsigned'
            );
          }
          if (!signBlock.some((line) => !isComment(line)
              && /--entitlements\s+studio\/src-tauri\/Entitlements\.plist/.test(line))) {
            throw new Error(
              'The app must be re-signed with studio/src-tauri/Entitlements.plist: codesign '
              + '--force replaces a signature wholesale, so omitting it strips the app\'s '
              + 'entitlements'
            );
          }
          if (!signBlock.some((line) => /MIN_SIGNED_TOTAL:/.test(line))) {
            throw new Error(
              'The macOS signing step must declare a floor for how many Mach-O files it '
              + 'signs, so a silently empty payload cannot reach notarization'
            );
          }

          // The entitlements split, which is the reason there are two plists at
          // all: the app does not get library-validation relief (nothing foreign
          // is loaded into its process), and the payload's executables do (a
          // user's own torch.compile output and pip-installed extensions are not
          // signed by us, and hardened runtime is mandatory inside a notarized
          // bundle).
          // The <key> element, not the string: both plists explain in a comment
          // why the key is or is not there, and a substring match would read the
          // explanation as the setting.
          const libraryValidationKey =
            /<key>\s*com\.apple\.security\.cs\.disable-library-validation\s*<\/key>/;
          const appEntitlements = readFileSync('studio/src-tauri/Entitlements.plist', 'utf8');
          if (libraryValidationKey.test(appEntitlements)) {
            throw new Error(
              'studio/src-tauri/Entitlements.plist must not carry '
              + 'com.apple.security.cs.disable-library-validation: it applies to the app\'s own '
              + 'process, which loads nothing but Apple frameworks and its own code. The bundled '
              + 'interpreter needs it and is signed with its own entitlements instead.'
            );
          }
          if (!signBlock.some((line) => libraryValidationKey.test(line))) {
            throw new Error(
              'The payload\'s executables must be signed with '
              + 'com.apple.security.cs.disable-library-validation, or a user\'s own extension '
              + 'modules will not load under the hardened runtime a notarized bundle requires'
            );
          }

          const verifyBlock = stepBlock('Verify every Mach-O in the macOS bundle is signed');
          if (!verifyBlock.some((line) => !isComment(line) && /--verify --deep --strict/.test(line))) {
            throw new Error(
              'The macOS verification step must run codesign --verify --deep --strict over the app'
            );
          }

          const releaseBody = process.env.DESKTOP_RELEASE_NOTES;
          if (!releaseBody) {
            throw new Error('DESKTOP_RELEASE_NOTES must not be empty');
          }
          if (/\brpm\b|\.rpm/i.test(releaseBody)) {
            throw new Error('Desktop release body must not advertise RPM packages');
          }
          if (/AppImage.*universal|universal.*AppImage/i.test(releaseBody)) {
            throw new Error('Desktop release body must not advertise AppImage as universal');
          }
          if (!/AppImage.*experimental/i.test(releaseBody)) {
            throw new Error('Desktop release body must mark AppImage as experimental');
          }
          JS

      - name: Install frontend dependencies
        working-directory: studio/frontend
        # `npm ci`, not `npm install`: the release must install exactly the tree
        # in studio/frontend/package-lock.json, and `npm install` is free to
        # re-resolve a range and rewrite that lockfile in the working tree.
        # Lifecycle scripts (esbuild native-binary postinstall, etc.) are
        # required for `vite build`. The pre-install lockfile structural
        # audit (lockfile_supply_chain_audit.py) is the practical defence
        # against the npm postinstall-dropper class -- it fires BEFORE any
        # tarball runs, on the injection pattern itself rather than an
        # advisory-DB lookup.
        run: npm ci --no-fund --no-audit

      # ── Rust ──
      # `toolchain:` is passed explicitly and must stay byte-identical to
      # `channel` in studio/src-tauri/rust-toolchain.toml. The action's
      # `toolchain` input defaults to `stable`, so without this the requested
      # cross-compilation targets would be installed against stable while
      # rust-toolchain.toml forces every cargo invocation onto 1.94.1 -- the
      # aarch64/x86_64 Apple std would be missing from the toolchain that
      # actually builds, and the macOS leg would fail on a missing target.
      # Change both files together.
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27
        with:
          toolchain: '1.94.1'
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Patch desktop app version
        shell: bash
        working-directory: studio/src-tauri
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          "$PYTHON" <<'PY'
          import os
          import pathlib
          import re
          import sys

          app_version = os.environ['APP_VERSION']
          if not app_version:
              sys.exit('APP_VERSION is required')

          cargo_toml = pathlib.Path('Cargo.toml')
          lines = cargo_toml.read_text().splitlines(keepends=True)
          in_package = False
          patched = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == '[package]':
                  in_package = True
                  continue
              if stripped.startswith('[') and stripped.endswith(']'):
                  in_package = False
              if in_package and re.fullmatch(r'version\s*=\s*"[^"]+"\s*', stripped):
                  lines[index] = f'version = "{app_version}"\n'
                  patched = True
                  break
          if not patched:
              sys.exit('Could not patch [package] version in Cargo.toml')
          cargo_toml.write_text(''.join(lines))

          cargo_lock = pathlib.Path('Cargo.lock')
          lock_text = cargo_lock.read_text()
          lock_text, count = re.subn(
              r'(?m)(^\[\[package\]\]\nname = "unsloth-studio"\nversion = ")[^"]+(")',
              lambda match: f'{match.group(1)}{app_version}{match.group(2)}',
              lock_text,
          )
          if count != 1:
              sys.exit(f'Could not patch unsloth-studio version in Cargo.lock (matches={count})')
          cargo_lock.write_text(lock_text)
          PY

          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          "$PYTHON" <<'PY'
          import json
          import os
          import pathlib
          import sys

          app_version = os.environ['APP_VERSION']
          metadata = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'cargo-metadata.json').read_text())
          versions = [package['version'] for package in metadata.get('packages', []) if package.get('name') == 'unsloth-studio']
          if versions != [app_version]:
              sys.exit(f'cargo metadata unsloth-studio version mismatch: expected {app_version}, got {versions}')
          PY

          git diff -- Cargo.toml Cargo.lock

      # ── Lockfile immutability, part 1 of 2 ──
      # A build that rewrites a lockfile built something other than what was
      # reviewed, and today that would pass silently. The obvious check --
      # `git diff --exit-code` over the three lockfiles after the build -- is
      # only correct for two of them: the step above deliberately rewrites the
      # `unsloth-studio` entry in Cargo.lock, so its baseline is the post-patch
      # state, not HEAD.
      #
      # So the check is split. The two npm lockfiles are never touched by this
      # workflow, and `npm ci` (unlike `npm install`) does not rewrite one, so
      # HEAD stays their baseline and that is asserted here -- after both
      # installs have already run, which is the point at which a rewriting
      # install would have shown up. Cargo.lock is checked against HEAD too, but
      # for confinement: the only difference may be the one version line the
      # patch step wrote. Digests of all three are then snapshotted for part 2.
      - name: Snapshot lockfile digests
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          # Both npm installs have run by now, so a lockfile-rewriting install
          # fails here rather than shipping a tree nobody reviewed.
          git diff --exit-code -- studio/package-lock.json studio/frontend/package-lock.json
          "$PYTHON" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          LOCKFILES = (
              'studio/src-tauri/Cargo.lock',
              'studio/package-lock.json',
              'studio/frontend/package-lock.json',
          )

          # Windows runners check out with core.autocrlf, so the bytes on disk
          # differ from the LF-canonical source for any file .gitattributes does
          # not pin. Normalise CRLF to LF before hashing: the digest is then a
          # property of the source, identical on all three matrix legs, and on a
          # Linux/macOS checkout it equals a plain sha256sum of the file.
          def digest(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes().replace(b'\r\n', b'\n')).hexdigest()

          diff = subprocess.run(
              ['git', 'diff', '-U0', '--', 'studio/src-tauri/Cargo.lock'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          changed = [
              line for line in diff.splitlines()
              if re.fullmatch(r'[-+](?!(?:\+\+|--)).*', line)
          ]
          # Zero changed lines is the patch step finding the release version
          # already in place; two is the version line it rewrote. Anything else
          # means something other than the patch touched the lockfile.
          if len(changed) not in (0, 2) or not all(
              re.fullmatch(r'[-+]version = "[^"]+"', line) for line in changed
          ):
              sys.exit(
                  'Cargo.lock differs from the tag by more than the release version '
                  f'patch, so the build would use a dependency set nobody reviewed:\n{diff}'
              )

          snapshot = {path: digest(pathlib.Path(path)) for path in LOCKFILES}
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'lockfile-digests.json')
          out.write_text(json.dumps(snapshot, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: 'studio/src-tauri -> target'

          # Windows release builds can spend many minutes uploading the target cache
          # after signed artifacts are ready, which blocks the publisher for no release benefit.
          save-if: ${{ matrix.platform != 'windows-latest' }}

      # ── macOS: fail before the build if notarization cannot run ──
      - name: Check Apple notarization credentials
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # A missing secret arrives as an empty string, so `set -u` never sees
          # it, and tauri-action just skips notarization instead of failing.
          # Check before the release build so a rotated secret costs seconds
          # rather than a full compile.
          for required in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "Missing $required; refusing to publish an unnotarized disk image." >&2
              exit 1
            fi
          done

      # ── macOS: import signing certificate ──
      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      # ── macOS: the self-contained runtime that ships inside the app ──
      # Unsloth.app/Contents/Resources/runtime holds a complete macOS arm64
      # runtime -- CPython, every Python distribution, llama.cpp, whisper.cpp,
      # Node and the OXC node_modules -- so copying the app off the .dmg is the
      # whole installation and first launch builds nothing.
      #
      # THE ORDER IS NOT NEGOTIABLE. Injecting a payload into a signed bundle
      # invalidates its signature, so scripts/inject_macos_runtime.sh refuses an
      # app that is already signed. That single constraint decides this whole leg:
      #
      #   assemble payload -> tauri build (UNSIGNED) -> inject -> sign every
      #   Mach-O in the payload -> sign the app -> rebuild the updater tarball
      #   and the .dmg around the signed app -> notarize and staple the .dmg
      #
      # "Build macOS app" below therefore no longer receives APPLE_SIGNING_IDENTITY
      # (see the comment there), and everything Apple-signed is signed by the
      # steps after the injection instead of by tauri-bundler.
      #
      # These three steps run BEFORE the build on purpose: they are the ones most
      # likely to fail (a moved wheel, a bumped pin, a stale lock, an unreachable
      # release), and failing them costs seconds instead of a ~20 minute compile.
      - name: Install the pinned uv
        if: matrix.platform == 'macos-latest'
        # The version install.sh downloads for users, read out of install.sh
        # rather than written here twice: the runtime payload is installed by uv,
        # so a payload built with a different uv is a payload for an install
        # nobody performs. Both lock generators and the assembly script refuse to
        # run against any other version, so drift fails loudly here rather than
        # producing a subtly different bundle. Same step as in
        # desktop-dev-build.yml, so a dev build is evidence about this one.
        id: uv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^UV_PINNED_VERSION="\([^"]*\)".*/\1/p' install.sh | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::could not read UV_PINNED_VERSION out of install.sh" >&2
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/uvpin"
          "$RUNNER_TEMP/uvpin/bin/python" -m pip install --quiet --disable-pip-version-check \
            "uv==$version"
          "$RUNNER_TEMP/uvpin/bin/uv" --version
          echo "bin=$RUNNER_TEMP/uvpin/bin/uv" >> "$GITHUB_OUTPUT"

      - name: Check the macOS bundle lock is not stale
        if: matrix.platform == 'macos-latest'
        # Cheap, and it runs before every expensive step. A bundle lock that no
        # longer matches a fresh regeneration means a requirements file, the torch
        # window, the MLX ceilings or the pins moved without the lock following,
        # and the payload assembled below would ship versions nobody reviewed --
        # inside a signed, notarized release.
        shell: bash
        env:
          UV: ${{ steps.uv.outputs.bin }}
        run: bash scripts/gen_macos_bundle_lock.sh --check

      - name: Assemble the bundled runtime payload
        if: matrix.platform == 'macos-latest'
        # Everything the app needs at runtime, verified at build time: CPython,
        # all Python distributions under --require-hashes, llama.cpp,
        # whisper.cpp, Node and the OXC node_modules.
        shell: bash
        env:
          UV: ${{ steps.uv.outputs.bin }}
        run: |
          set -euo pipefail
          bash scripts/build_macos_runtime.sh --out "$RUNNER_TEMP/runtime"
          python3 - "$RUNNER_TEMP/runtime/BUNDLE_MANIFEST.json" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1]))
          # --skip-diffusers-pin and --with-sd-cpp both record themselves in the
          # manifest. A release must ship the complete payload, so an incomplete
          # one fails here rather than reaching a signature.
          if manifest["incomplete"]:
              sys.exit(f'the assembled payload is incomplete: {manifest["incomplete"]}')
          print(
              f'payload ok: python {manifest["python"]["version"]}, '
              f'{manifest["distribution_count"]} distributions, '
              f'{manifest["total_bytes"] / (1024 ** 3):.2f} GiB'
          )
          PY

      # ── Windows: install Azure Trusted Signing CLI ──
      # This binary runs in the steps holding the Azure Trusted Signing and
      # Tauri signing secrets, so where it comes from is a signing-key question,
      # not a build-speed one. Caching the `cargo install` build (241s and 248s
      # on the last two runs) made the cache the source of truth: a hit skipped
      # the install, and the restored executable went on PATH gated only by a
      # `--version` probe, which any binary can print.
      #
      # Upstream publishes the same tool prebuilt, so pin it instead. The URL is
      # reproducibility, the SHA-256 is the integrity gate: a release asset can
      # be replaced after upload, and a replaced one now fails the release
      # rather than signing with an unknown binary. Same shape as the AppImage
      # toolchain below, and faster than the cache it replaces. Bump the URL and
      # the digest together when moving off 0.10.0.
      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest'
        # Explicit, like every other Windows step here. The retry parameters
        # below are PowerShell 6+ only, so under 5.1 the download fails with "A
        # parameter cannot be found that matches parameter name
        # 'MaximumRetryCount'". Naming the shell keeps that deliberate.
        shell: pwsh
        env:
          TRUSTED_SIGNING_CLI_URL: "https://github.com/Levminer/artifact-signing-cli/releases/download/0.10.0/trusted-signing-cli.exe"
          TRUSTED_SIGNING_CLI_SHA256: "8c9d750ca582891a7433925dcf302d5d3761fbed757b46c4bf5b417562dccb0e"
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "trusted-signing-cli"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dest = Join-Path $dir "trusted-signing-cli.exe"

          Invoke-WebRequest -Uri $env:TRUSTED_SIGNING_CLI_URL -OutFile $dest -MaximumRetryCount 3 -RetryIntervalSec 5

          $actual = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLower()
          $expected = $env:TRUSTED_SIGNING_CLI_SHA256.ToLower()
          if ($actual -ne $expected) {
            # Delete it first: a later step resolving this name off PATH must
            # not find the rejected download still sitting there.
            Remove-Item -Force $dest
            Write-Output "::error::trusted-signing-cli digest mismatch, refusing to sign with an unverified binary. Expected $expected, got $actual. Re-pin TRUSTED_SIGNING_CLI_SHA256 deliberately if upstream republished the asset."
            exit 1
          }
          Write-Output "verified trusted-signing-cli sha256=$actual"

          # $GITHUB_PATH prepends, which is what this needs: swatinem/rust-cache
          # restores ~/.cargo/bin, already on PATH, and a stale entry there can
          # carry its own unverified copy of this binary. The verified one has
          # to win the name lookup.
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Windows: verify signing CLI is accessible ──
      # Fails closed. This used to print a message and exit 0 on both branches,
      # so a missing or broken binary reported success and the failure only
      # surfaced later, inside the Tauri bundling step, as a signing error with
      # no obvious cause.
      - name: Verify trusted-signing-cli
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "PATH: $env:PATH"

          $cli = Get-Command trusted-signing-cli -ErrorAction SilentlyContinue
          if (-not $cli) {
            Write-Output "::error::trusted-signing-cli is not on PATH. Check the 'Install trusted-signing-cli' step above."
            exit 1
          }
          Write-Output "resolved: $($cli.Source)"

          # The signing script invokes this by bare name, so whatever PATH
          # resolves is what signs. Only the digest-verified copy installed
          # above may do that; anything else on PATH under the same name (a
          # leftover in ~/.cargo/bin, say) is unverified by definition.
          $verified = [IO.Path]::GetFullPath((Join-Path (Join-Path $env:RUNNER_TEMP "trusted-signing-cli") "trusted-signing-cli.exe"))
          if ([IO.Path]::GetFullPath($cli.Source) -ne $verified) {
            Write-Output "::error::trusted-signing-cli resolved to $($cli.Source), not the verified $verified. Refusing to sign with a binary that was never digest checked."
            exit 1
          }

          # Two different failure modes, and neither one covers the other:
          #   * the binary cannot be started at all (a truncated download gives
          #     "Exec format error"). That raises a terminating error under
          #     $ErrorActionPreference = "Stop", so it has to be caught or the
          #     step dies here, before the message below.
          #   * the binary starts and exits non-zero. That does NOT raise, so
          #     $LASTEXITCODE has to be read explicitly.
          try {
            & $cli.Source --version
          }
          catch {
            # The PowerShell error spans several lines (message, offending line,
            # caret). An annotation is truncated at the first newline, so flatten
            # it, and put the recovery ahead of the detail so it survives even if
            # the annotation is clipped for length.
            $detail = ($_.Exception.Message -replace '\s+', ' ').Trim()
            Write-Output "::error::trusted-signing-cli could not be started. Re-run to fetch it again; if it persists the pinned asset is bad. Underlying error: $detail"
            exit 1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::trusted-signing-cli is on PATH but exited $LASTEXITCODE."
            exit 1
          }

      # ── Linux: pin AppImage packaging toolchain ──
      - name: Pin thin AppImage toolchain
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          # Pinning the versioned release path is reproducibility, not
          # integrity: a GitHub release asset can be replaced (or its delivery
          # path compromised) after upload. The SHA-256 digests of these exact
          # assets are the integrity gate. A replaced
          # release asset fails closed and must be re-pinned deliberately.
          APPIMAGETOOL_URL: "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          APPIMAGE_RUNTIME_URL: "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          APPIMAGE_RUNTIME_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools_dir"
          appimagetool="$tools_dir/appimagetool-x86_64.AppImage"
          runtime="$tools_dir/runtime-x86_64"
          curl -fsSL "$APPIMAGETOOL_URL" -o "$appimagetool"
          curl -fsSL "$APPIMAGE_RUNTIME_URL" -o "$runtime"
          # Verify the digest BEFORE the binary is ever marked executable. The
          # later step builds the AppImage with the Tauri signing key, so a
          # substituted packager that ran there could exfiltrate signing
          # material or tamper with release artifacts. Fail closed on any
          # mismatch.
          echo "${APPIMAGETOOL_SHA256}  ${appimagetool}" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_SHA256}  ${runtime}" | sha256sum -c -
          chmod +x "$appimagetool"

      # ── Linux: build the native package once ──
      - name: Build Linux deb
        id: build_linux
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0.6.2
        with:
          projectPath: studio
          tauriScript: npx --prefix . tauri
          args: >-
            -v --bundles deb
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # ── Linux: wrap the deb payload without bundling the GTK/WebKit stack ──
      - name: Build and sign thin Linux AppImage
        id: package_linux
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.build_linux.outputs.artifactPaths }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key is not password protected, and no secret of this name
          # exists, so this expression has always resolved to the empty string.
          # Stated literally rather than left pointing at a secret that is not
          # there: the value is unchanged, but it no longer reads as configuration
          # someone forgot to set. Empty is not the same as unset here -- tauri
          # prompts for a password when the variable is absent, which would hang
          # the job, so the line stays.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          deb_path="$(
            python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          paths = json.loads(os.environ.get('ARTIFACT_PATHS', ''))
          matches = [pathlib.Path(path) for path in paths if str(path).endswith('.deb')]
          if len(matches) != 1 or not matches[0].is_file():
              sys.exit(f'Expected exactly one Linux deb artifact, got {matches}')
          print(matches[0])
          PY
          )"
          output_dir="studio/src-tauri/target/release/bundle/appimage"
          appimage="$output_dir/unsloth-studio_${APP_VERSION}_amd64.AppImage"
          export APPIMAGE_PATH="$appimage"
          studio/src-tauri/linux/build-thin-appimage.sh \
            "$deb_path" \
            "$RUNNER_TEMP/appimage-tools/appimagetool-x86_64.AppImage" \
            "$RUNNER_TEMP/appimage-tools/runtime-x86_64" \
            "$appimage"
          signature="${appimage}.sig"
          # The signer writes ${appimage}.sig itself; stdout is human-readable diagnostics.
          npx --prefix studio tauri signer sign "$appimage"
          python3 - "$signature" <<'PY'
          import base64
          import binascii
          import pathlib
          import sys

          signature_path = pathlib.Path(sys.argv[1])
          signature_value = signature_path.read_text(encoding='utf-8').strip()
          try:
              decoded = base64.b64decode(signature_value, validate=True)
          except (binascii.Error, ValueError):
              sys.exit('Tauri signer did not create a base64 minisign signature')
          if not decoded.startswith(b'untrusted comment:') or b'\ntrusted comment:' not in decoded:
              sys.exit('Tauri signer did not create a minisign signature payload')
          signature_path.write_text(signature_value + '\n', encoding='utf-8')
          PY
          python3 - <<'PY'
          import json
          import os

          deb_paths = json.loads(os.environ['ARTIFACT_PATHS'])
          appimage = os.environ['APPIMAGE_PATH']
          paths = [*deb_paths, appimage, f'{appimage}.sig']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'artifactPaths={json.dumps(paths)}\n')
          PY

      # ── macOS: build unsigned, then inject, then sign, then repackage ──
      # This step deliberately holds NO Apple credentials. It used to be
      # "build + sign + notarize" in one action, and that stopped being possible
      # when the bundled runtime landed: tauri-bundler signs the .app, then builds
      # the .dmg and the updater tarball from it, and the payload has to go in
      # BEFORE any of that or the signature it produced is invalid the moment the
      # runtime is copied in. scripts/inject_macos_runtime.sh refuses a signed
      # app for exactly that reason.
      #
      # So tauri produces an unsigned .app, an unsigned .dmg and an updater
      # tarball built from an app with no payload in it, and the steps below
      # replace all three: the payload is injected, every Mach-O in it is signed
      # with the release identity, the app is signed over the top, and the .dmg
      # and the updater tarball are rebuilt around the signed app. The .dmg keeps
      # the path tauri reported, so "Notarize final macOS disk image" and "Stage
      # release assets" still read steps.build_macos.outputs.artifactPaths and
      # need no knowledge of any of this.
      #
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are gone from here too: they
      # only ever did anything in combination with a signing identity (tauri
      # notarizes only what it signed), and leaving them would suggest this step
      # still notarizes something. It does not; the .dmg step below does.
      - name: Build macOS app
        id: build_macos
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key is not password protected, and no secret of this name
          # exists, so this expression has always resolved to the empty string.
          # Stated literally rather than left pointing at a secret that is not
          # there: the value is unchanged, but it no longer reads as configuration
          # someone forgot to set. Empty is not the same as unset here -- tauri
          # prompts for a password when the variable is absent, which would hang
          # the job, so the line stays.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: studio
          tauriScript: npx --prefix . tauri
          args: -v ${{ matrix.args }}

      - name: Locate the built macOS bundle
        id: macos_bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.build_macos.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          app="$(find studio/src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
                   -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::no .app was produced by the macOS build" >&2
            exit 1
          fi
          test -f "$app/Contents/Info.plist"
          echo "app_path=$app" >> "$GITHUB_OUTPUT"
          # The three files tauri reported, resolved from the same output the
          # notarization and staging steps read, so the steps below rewrite
          # exactly what the release will publish rather than a sibling copy.
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          try:
              paths = json.loads(os.environ.get('ARTIFACT_PATHS', ''))
          except json.JSONDecodeError as error:
              sys.exit(f'Invalid tauri-action artifactPaths output: {error}')
          if not isinstance(paths, list):
              sys.exit('tauri-action artifactPaths must be a JSON list')
          paths = [path for path in paths if isinstance(path, str)]

          def exactly_one(label: str, predicate) -> str:
              matches = sorted({path for path in paths if predicate(path)})
              if len(matches) != 1:
                  sys.exit(f'Expected exactly one {label} from tauri-action, found {matches}')
              return matches[0]

          # Order matters: an updater signature also ends in .sig, and the tarball
          # name is a prefix of the signature's.
          print('dmg_path=' + exactly_one('.dmg', lambda p: p.lower().endswith('.dmg')))
          print('updater_sig_path=' + exactly_one(
              'updater signature', lambda p: p.endswith('.app.tar.gz.sig')
          ))
          print('updater_path=' + exactly_one(
              'updater tarball', lambda p: p.endswith('.app.tar.gz')
          ))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Inject the bundled runtime into the macOS app
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APP: ${{ steps.macos_bundle.outputs.app_path }}
        run: |
          set -euo pipefail
          # --app only, and no --dmg on purpose. The script's --dmg mode adds the
          # payload to the image tauri built, which would leave that image holding
          # an UNSIGNED app; the image is rebuilt further down around the signed
          # one instead. The script still refuses a signed app, so if anything
          # ever starts signing before this point, this fails rather than shipping
          # a broken signature.
          bash scripts/inject_macos_runtime.sh \
            --payload "$RUNNER_TEMP/runtime" \
            --app "$APP"

      # ── macOS: sign the payload, inside out, then the app ──
      # Tauri's bundler seals resources as data. It does not sign nested Mach-O
      # files, and Contents/Resources/runtime holds ~700 of them (617 .so/.dylib
      # in site-packages, 54 in CPython, 45 in llama.cpp, plus whisper.cpp, Node
      # and the OXC .node addons). Notarization rejects an unsigned Mach-O, so
      # every one of them is signed here with the release identity, hardened
      # runtime and a secure timestamp.
      #
      # WHY NOT codesign --deep
      #
      # Because it would not work, before any of the reasons Apple gives for
      # calling it "for emergency repairs only". --deep walks nested *bundles* and
      # the standard code locations inside them; a .so sitting in
      # Contents/Resources is a resource as far as it is concerned, so it would
      # sign the app, report success, and leave all ~700 payload Mach-Os
      # unsigned -- exactly the notarization failure this step exists to prevent.
      # On top of that it would apply one entitlement set to everything it did
      # find, which is the opposite of what is wanted here (see the two plists
      # below).
      #
      # WHAT "INSIDE OUT" MEANS HERE
      #
      # Signing a container seals what is inside it, so contents must be signed
      # first or the seal records unsigned content. The payload has exactly one
      # containment relation -- the .app contains all of it -- because the guard
      # below refuses any nested .framework/.app/.xpc/.bundle inside the payload,
      # which is the only thing that could create another one. So the required
      # order is "all 700 payload Mach-Os, then the app bundle", and the list is
      # additionally sorted deepest-first so that if a nested bundle ever does
      # appear the order is still correct while the guard explains itself.
      - name: Sign the bundled runtime and the macOS app
        id: sign_macos
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APP: ${{ steps.macos_bundle.outputs.app_path }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Below the ~720 measured today, far above what any single missing
          # component could leave behind, and per component so that a payload
          # that lost llama.cpp cannot hide inside a healthy total.
          MIN_SIGNED_TOTAL: '600'
          MIN_SIGNED_SITE_PACKAGES: '400'
          MIN_SIGNED_PYTHON: '30'
          MIN_SIGNED_LLAMA_CPP: '20'
          MIN_SIGNED_WHISPER_CPP: '1'
          MIN_SIGNED_NODE: '1'
          MIN_SIGNED_OXC_NODE_MODULES: '1'
        run: |
          set -euo pipefail
          # No `set -x` anywhere in this step: the identity is a masked secret and
          # a traced `codesign --sign "$IDENTITY"` line puts it in the log 700 times.
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY is empty; refusing to publish an unsigned bundle." >&2
            exit 1
          fi

          # "Import Apple certificate" ran with `set-keychain-settings -t 3600`,
          # and on this leg it now runs more than an hour before the first
          # signature (payload assembly plus the Rust compile). An idle keychain
          # relocks, and codesign against a locked keychain fails with "User
          # interaction is not allowed". Unlock it here, in the step that needs it.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # ── The two entitlement sets ──
          # studio/src-tauri/Entitlements.plist is the APP's, and it is passed
          # explicitly below because `codesign --force` on a bundle replaces its
          # signature wholesale: omitting it would silently strip the app's
          # network-client and microphone entitlements.
          #
          # The payload's executables need a different, deliberately smaller set,
          # and they need their OWN because entitlements are a property of a
          # signed executable, not something a parent process passes down. The
          # bundled python3 is a child process; whatever the app is entitled to
          # says nothing about what python3 may load.
          runtime_entitlements="$RUNNER_TEMP/runtime-entitlements.plist"
          cat > "$runtime_entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <!--
                Entitlements for the executables INSIDE Contents/Resources/runtime
                (python3, node, llama-server, whisper-server and the other helper
                binaries), not for the app. Two keys, both load-bearing:

                disable-library-validation: hardened runtime otherwise restricts
                a process to libraries signed by the same Team ID or by Apple.
                Everything shipped in the payload is signed by us and would pass,
                but the extension modules a user's own work produces are not:
                torch.compile writes a .so and dlopen()s it, `pip install` of
                anything with a native extension lands an unsigned .so in the
                user's data root, and node loads .node addons the same way. All of
                that works today because these binaries live unsigned under
                ~/.unsloth with no hardened runtime at all; shipping them inside a
                notarized bundle means hardened runtime is mandatory, so the
                exception has to be stated for the processes that need it.

                allow-unsigned-executable-memory: the JIT paths in the same stack
                (numba's LLVM JIT, torch inductor) map generated code as
                executable.

                Deliberately NOT here: allow-dyld-environment-variables. The
                backend sets DYLD_LIBRARY_PATH for llama-server as a fallback for
                a prebuilt with wrong install names (see
                core/inference/llama_cpp.py); hardened runtime strips DYLD_* from
                a process that is not entitled for it, so that fallback is inert
                for the bundled copy. That is acceptable because the payload's
                llama-server resolves through @loader_path, which is what
                desktop-dev-build.yml proves when it runs the binary out of the
                mounted .dmg with no DYLD_LIBRARY_PATH set at all. Entitling every
                payload executable to honour injected loader variables would buy
                nothing for a case that does not occur.
              -->
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          PLIST
          # plutil, not a comment claiming it is well formed: a malformed
          # entitlements file makes codesign fail 700 times in a row instead of
          # once here. Note the XML comment above must contain no double hyphen,
          # which is what this catches if one is ever added.
          plutil -lint "$runtime_entitlements"
          plutil -p "$runtime_entitlements"

          # ── Find the Mach-O files by reading their headers ──
          # Not by extension: this payload carries .so (CPython extension
          # modules), .dylib (llama.cpp, ggml, libpython), .node (the OXC parser
          # binding) and bare extensionless executables (python3.13, node,
          # llama-server, whisper-server, torch_shm_manager), and a list of
          # suffixes would have to be right about all of them forever.
          #
          # So every regular file under the .app is opened, its first four bytes
          # are compared against the Mach-O and universal-binary magics, and any
          # candidate has its `filetype` header field read to decide what it is:
          # MH_EXECUTE gets the payload entitlements, MH_DYLIB/MH_BUNDLE get none
          # (a library's entitlements are ignored; the process that loads it is
          # what carries them), MH_OBJECT is skipped because codesign cannot sign
          # an object file and notarization does not ask it to, and anything else
          # fails the release rather than being quietly skipped.
          python3 <<'PY'
          import json
          import os
          import pathlib
          import struct
          import sys

          MACHO_MAGICS = {
              b"\xcf\xfa\xed\xfe": ("<", 64),   # MH_MAGIC_64, little endian
              b"\xce\xfa\xed\xfe": ("<", 32),   # MH_MAGIC, little endian
              b"\xfe\xed\xfa\xcf": (">", 64),   # big endian
              b"\xfe\xed\xfa\xce": (">", 32),
          }
          FAT_MAGICS = {b"\xca\xfe\xba\xbe", b"\xca\xfe\xba\xbf",
                        b"\xbe\xba\xfe\xca", b"\xbf\xba\xfe\xca"}
          MH_OBJECT, MH_EXECUTE, MH_DYLIB, MH_BUNDLE = 0x1, 0x2, 0x6, 0x8
          NAMES = {MH_OBJECT: "object", MH_EXECUTE: "executable",
                   MH_DYLIB: "dylib", MH_BUNDLE: "bundle"}

          def slice_filetype(blob, offset):
              magic = blob[offset:offset + 4]
              if magic not in MACHO_MAGICS:
                  return None
              endian, _ = MACHO_MAGICS[magic]
              (filetype,) = struct.unpack_from(endian + "I", blob, offset + 12)
              return filetype

          def filetypes(path):
              """Mach-O filetypes in this file, or None if it is not a Mach-O at all."""
              with open(path, "rb") as handle:
                  blob = handle.read(65536)
              if len(blob) < 16:
                  return None
              head = blob[:4]
              if head in MACHO_MAGICS:
                  found = slice_filetype(blob, 0)
                  return None if found is None else {found}
              if head not in FAT_MAGICS:
                  return None
              # A universal binary. CA FE BA BE is also the Java class magic, so
              # the count has to be plausible AND every slice header has to be a
              # real Mach-O; a class file's version fields fail both.
              (count,) = struct.unpack_from(">I", blob, 4)
              if not 1 <= count <= 16:
                  return None
              found = set()
              for index in range(count):
                  entry = 8 + index * 20
                  if entry + 20 > len(blob):
                      return None
                  (offset,) = struct.unpack_from(">I", blob, entry + 8)
                  with open(path, "rb") as handle:
                      handle.seek(offset)
                      slice_blob = handle.read(4096)
                  kind = slice_filetype(slice_blob, 0)
                  if kind is None:
                      return None
                  found.add(kind)
              return found

          app = pathlib.Path(os.environ["APP"]).resolve()
          runtime = app / "Contents" / "Resources" / "runtime"
          if not runtime.is_dir():
              sys.exit(f"{runtime} does not exist; the injection step did not run")

          # A nested bundle would introduce a second containment relation, and
          # signing the Mach-O inside one instead of the bundle around it is
          # wrong. None exist today; refuse rather than sign the wrong thing.
          nested = sorted(
              str(path.relative_to(app))
              for path in runtime.rglob("*")
              if path.is_dir() and path.suffix in (".framework", ".app", ".xpc", ".bundle")
          )
          if nested:
              sys.exit(
                  "the payload contains nested code bundles, which need to be signed as "
                  f"bundles rather than as files: {nested}"
              )

          executables, libraries, objects, unexpected = [], [], [], []
          scanned = 0
          for path in sorted(app.rglob("*")):
              if path.is_symlink() or not path.is_file():
                  continue
              scanned += 1
              try:
                  kinds = filetypes(path)
              except OSError as error:
                  sys.exit(f"could not read {path}: {error}")
              if not kinds:
                  continue
              if kinds == {MH_OBJECT}:
                  objects.append(str(path))
                  continue
              stray = kinds - {MH_EXECUTE, MH_DYLIB, MH_BUNDLE}
              if stray:
                  unexpected.append(f"{path}: filetype(s) {sorted(hex(k) for k in stray)}")
                  continue
              if MH_EXECUTE in kinds:
                  executables.append(str(path))
              else:
                  libraries.append(str(path))

          if unexpected:
              sys.exit(
                  "unrecognised Mach-O filetypes; decide what they are rather than "
                  "leaving them unsigned:\n  " + "\n  ".join(unexpected)
              )

          # Everything outside the payload is covered by signing the bundle, and
          # the only Mach-O a tauri app bundle keeps there is its main executable
          # in Contents/MacOS. A sidecar or a Frameworks directory appearing later
          # would need signing of its own, so it fails here instead of shipping
          # unsigned.
          macos_dir = app / "Contents" / "MacOS"
          covered_by_bundle = (
              {str(path) for path in macos_dir.iterdir() if path.is_file() and not path.is_symlink()}
              if macos_dir.is_dir() else set()
          )
          prefix = str(runtime) + os.sep
          stray = sorted(
              path for path in executables + libraries
              if not path.startswith(prefix) and path not in covered_by_bundle
          )
          if stray:
              sys.exit(
                  "Mach-O files outside both the payload and Contents/MacOS; signing the "
                  f"app bundle does not cover these: {stray}"
              )

          payload_executables = sorted(p for p in executables if p.startswith(prefix))
          payload_libraries = sorted(p for p in libraries if p.startswith(prefix))

          # Deepest first. See the step comment: with no nested bundles this is
          # belt and braces, and it stays correct if one ever appears.
          def depth_key(path):
              return (-path.count(os.sep), path)

          out = pathlib.Path(os.environ["RUNNER_TEMP"])
          def dump(name, paths):
              (out / name).write_bytes(
                  b"".join(p.encode() + b"\0" for p in sorted(paths, key = depth_key))
              )

          dump("macho-executables", payload_executables)
          dump("macho-libraries", payload_libraries)
          # Object files are not signed, and the verification step needs to know
          # which ones they were: it re-detects Mach-Os with file(1) and compares
          # the two views, so "unsigned on purpose" has to be recorded rather than
          # inferred from a description string.
          dump("macho-objects", [p for p in objects if p.startswith(prefix)])

          counts = {}
          for path in payload_executables + payload_libraries:
              component = pathlib.Path(path).relative_to(runtime).parts[0]
              counts[component] = counts.get(component, 0) + 1
          summary = {
              "scanned_files": scanned,
              "payload_total": len(payload_executables) + len(payload_libraries),
              "payload_executables": len(payload_executables),
              "payload_libraries": len(payload_libraries),
              "objects_skipped": len(objects),
              "by_component": counts,
          }
          (out / "macho-summary.json").write_text(json.dumps(summary, indent = 2, sort_keys = True))
          print(json.dumps(summary, indent = 2, sort_keys = True))
          PY

          # ── The count guard ──
          # A payload that assembled but landed empty, or lost a component to a
          # moved path, would otherwise sail through: codesign would sign nothing,
          # report nothing, and notarization would pass because there is nothing
          # left to reject.
          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys

          summary = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "macho-summary.json").read_text())
          floors = {
              "site-packages": int(os.environ["MIN_SIGNED_SITE_PACKAGES"]),
              "python": int(os.environ["MIN_SIGNED_PYTHON"]),
              "llama.cpp": int(os.environ["MIN_SIGNED_LLAMA_CPP"]),
              "whisper.cpp": int(os.environ["MIN_SIGNED_WHISPER_CPP"]),
              "node": int(os.environ["MIN_SIGNED_NODE"]),
              "oxc-node-modules": int(os.environ["MIN_SIGNED_OXC_NODE_MODULES"]),
          }
          failures = []
          total_floor = int(os.environ["MIN_SIGNED_TOTAL"])
          if summary["payload_total"] < total_floor:
              failures.append(
                  f'only {summary["payload_total"]} Mach-O files in the payload, '
                  f'expected at least {total_floor}'
              )
          for component, floor in sorted(floors.items()):
              found = summary["by_component"].get(component, 0)
              if found < floor:
                  failures.append(
                      f'{component}: {found} Mach-O files, expected at least {floor}'
                  )
          if failures:
              sys.exit(
                  "the bundled runtime is implausibly thin, so it is not the payload "
                  "this release is supposed to ship:\n  " + "\n  ".join(failures)
              )
          print(f'{summary["payload_total"]} Mach-O files to sign: '
                f'{summary["payload_executables"]} executables, '
                f'{summary["payload_libraries"]} libraries '
                f'({summary["objects_skipped"]} object files skipped)')
          PY

          # ── Sign ──
          # One file per codesign call, sequentially. Batching would be faster,
          # but --timestamp is a round trip to Apple's timestamp service for every
          # code object; per file means a throttled or dropped timestamp is
          # retried on its own rather than re-signing 700 files, and the failure
          # names the file. `read -d ''` keeps arbitrary paths intact and works on
          # the bash 3.2 that macOS ships.
          sign_list() {
            list="$1"
            shift
            signed=0
            while IFS= read -r -d '' path; do
              attempt=1
              while :; do
                if codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
                     --options runtime --timestamp "$@" "$path"; then
                  break
                fi
                if [ "$attempt" -ge 3 ]; then
                  echo "::error::codesign failed three times for $path" >&2
                  return 1
                fi
                delay=$(( 10 * attempt ))
                echo "::warning::codesign failed for $path (attempt $attempt/3); retrying in ${delay}s"
                sleep "$delay"
                attempt=$(( attempt + 1 ))
              done
              signed=$(( signed + 1 ))
              # Progress goes to stderr so it reaches the log: stdout is the
              # function's return channel and the caller reads its last line.
              if [ $(( signed % 100 )) -eq 0 ]; then
                echo "  signed $signed ..." >&2
              fi
            done < "$list"
            echo "$signed"
          }

          echo "==> signing payload libraries (no entitlements: a library's are ignored)"
          libraries="$(sign_list "$RUNNER_TEMP/macho-libraries" | tail -n 1)"
          echo "==> signing payload executables (with the runtime entitlements)"
          executables="$(sign_list "$RUNNER_TEMP/macho-executables" \
            --entitlements "$runtime_entitlements" | tail -n 1)"

          echo "==> signing the app bundle (last, so it seals a fully signed payload)"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime --timestamp \
            --entitlements studio/src-tauri/Entitlements.plist \
            "$APP"

          total=$(( libraries + executables ))
          if [ "$total" -lt "$MIN_SIGNED_TOTAL" ]; then
            echo "::error::signed only $total Mach-O files in the payload" >&2
            exit 1
          fi
          echo "signed $total Mach-O files in the payload ($libraries libraries, $executables executables), then the app"
          echo "signed_macho_count=$total" >> "$GITHUB_OUTPUT"
          echo "SIGNED_MACHO_COUNT=$total" >> "$GITHUB_ENV"

      - name: Verify every Mach-O in the macOS bundle is signed
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APP: ${{ steps.macos_bundle.outputs.app_path }}
          SIGNED: ${{ steps.sign_macos.outputs.signed_macho_count }}
        run: |
          set -euo pipefail
          # An independent oracle first. file(1) is the system's own identification,
          # so if the header parser in the signing step missed a Mach-O -- the
          # exact thing notarization would then reject -- the two views disagree
          # and this fails. `find -type f` excludes symlinks, so nothing is counted
          # twice through a link.
          find "$APP" -type f -print > "$RUNNER_TEMP/all-files.txt"
          file -f "$RUNNER_TEMP/all-files.txt" > "$RUNNER_TEMP/all-types.txt"
          python3 <<'PY'
          import os
          import pathlib
          import sys

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          paths = temp.joinpath("all-files.txt").read_text().splitlines()
          runtime = str(pathlib.Path(os.environ["APP"]).resolve() / "Contents/Resources/runtime")

          # file(1) output is parsed as "<path>: <description>" rather than paired
          # positionally with --brief, because a universal binary can be described
          # over more than one line and positional pairing would then silently
          # shift every following file's description by one.
          known = set(paths)
          bad = sorted(path for path in paths if ": " in path)
          if bad:
              sys.exit(f"paths containing ': ' cannot be attributed to a file(1) line: {bad}")

          described = {}
          current = None
          for line in temp.joinpath("all-types.txt").read_text().splitlines():
              head, separator, tail = line.partition(": ")
              if separator and head in known:
                  current = head
                  described[current] = tail
              elif current is not None:
                  described[current] += " " + line.strip()
          undescribed = sorted(set(paths) - set(described))
          if undescribed:
              sys.exit(f"file(1) said nothing about {len(undescribed)} files, e.g. {undescribed[:5]}")

          def read_list(name):
              blob = temp.joinpath(name).read_bytes()
              return {entry for entry in blob.decode().split("\0") if entry}

          signed = read_list("macho-executables") | read_list("macho-libraries")
          # Object files are Mach-O but cannot be signed, and the signing step
          # recorded which ones it decided that about.
          objects = read_list("macho-objects")

          found = {
              path for path, description in described.items()
              if "Mach-O" in description
              and str(pathlib.Path(path).resolve()).startswith(runtime + os.sep)
          }
          found = {str(pathlib.Path(path).resolve()) for path in found}
          missing = sorted(found - signed - objects)
          extra = sorted((signed | objects) - found)
          if missing or extra:
              sys.exit(
                  "the signing step's Mach-O list and file(1) disagree, so something in "
                  f"the payload may be unsigned:\n  only file(1) saw: {missing}\n"
                  f"  only the signer saw: {extra}"
              )
          pathlib.Path(temp, "macho-verify.txt").write_bytes(
              b"".join(entry.encode() + b"\0" for entry in sorted(signed))
          )
          print(f"file(1) and the signer agree on {len(signed)} signed Mach-O files "
                f"and {len(objects)} unsignable object files")
          PY

          # Then every one of them, individually: really signed (not ad hoc, so it
          # carries a Team Identifier) and really hardened (the runtime flag is
          # what notarization requires and what makes library validation apply).
          checked=0
          while IFS= read -r -d '' path; do
            info="$(codesign --display --verbose=4 "$path" 2>&1)" || {
              echo "::error::not signed: $path" >&2
              exit 1
            }
            case "$info" in
              *"flags="*"runtime"*) ;;
              *) echo "::error::signed without hardened runtime: $path" >&2; exit 1 ;;
            esac
            case "$info" in
              *"Signature=adhoc"*) echo "::error::ad hoc signature: $path" >&2; exit 1 ;;
            esac
            case "$info" in
              *"TeamIdentifier=not set"*)
                echo "::error::no Team Identifier, so this was not signed with the release identity: $path" >&2
                exit 1 ;;
              *"TeamIdentifier="*) ;;
              *) echo "::error::no Team Identifier line for $path" >&2; exit 1 ;;
            esac
            checked=$(( checked + 1 ))
          done < "$RUNNER_TEMP/macho-verify.txt"
          echo "verified $checked payload Mach-O signatures"
          if [ "$checked" -ne "$SIGNED" ]; then
            echo "::error::verified $checked signatures but the signing step reported $SIGNED" >&2
            exit 1
          fi

          # The whole bundle, including the seal over the payload.
          codesign --verify --deep --strict --verbose=2 "$APP"

          # The entitlements decision, asserted rather than described. The app is
          # signed WITHOUT disable-library-validation (nothing foreign is loaded
          # into its process; see studio/src-tauri/Entitlements.plist), and the
          # bundled interpreter is signed WITH it, because a user's own
          # torch.compile output or pip-installed extension is not signed by us.
          # plutil rather than PlistBuddy: the same value, from a tool this leg
          # already uses, and reachable through PATH so this step can be executed
          # against stubs in tests/security.
          executable="$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          app_entitlements="$(codesign --display --entitlements - --xml \
            "$APP/Contents/MacOS/$executable" 2>/dev/null || true)"
          case "$app_entitlements" in
            *disable-library-validation*)
              echo "::error::the app is signed with com.apple.security.cs.disable-library-validation; it does not need it" >&2
              exit 1 ;;
          esac
          case "$app_entitlements" in
            *network.client*) ;;
            *) echo "::error::the app lost its entitlements; --force without --entitlements strips them" >&2; exit 1 ;;
          esac
          python_entitlements="$(codesign --display --entitlements - --xml \
            "$APP/Contents/Resources/runtime/python/bin/python3" 2>/dev/null || true)"
          case "$python_entitlements" in
            *disable-library-validation*) ;;
            *)
              echo "::error::the bundled interpreter is signed without com.apple.security.cs.disable-library-validation, so a user's own extension modules will not load" >&2
              exit 1 ;;
          esac
          echo "entitlements: app without library-validation relief, bundled interpreter with it"

      # ── macOS: rebuild what tauri built from the pre-injection app ──
      # tauri produced the updater tarball and the disk image before the payload
      # existed and before anything was signed, so both are stale. They are
      # rebuilt here, in place, at the paths tauri reported -- so the release
      # asset names, "Stage release assets" and "Notarize final macOS disk image"
      # all stay exactly as they were.
      #
      # The tarball is not cosmetic: it is the auto-update payload. Publishing
      # tauri's copy would push shipped installs an app with no runtime in it and
      # no Apple signature, which macOS refuses to launch.
      - name: Rebuild the macOS updater artifact from the signed app
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APP: ${{ steps.macos_bundle.outputs.app_path }}
          UPDATER: ${{ steps.macos_bundle.outputs.updater_path }}
          UPDATER_SIG: ${{ steps.macos_bundle.outputs.updater_sig_path }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty, not unset: the CLI prompts for a password when the variable is
          # absent and would hang the job. Same reasoning as the build step.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          # COPYFILE_DISABLE keeps Apple's tar from writing AppleDouble `._`
          # members for extended attributes. Those would extract as files the
          # bundle's signature does not seal, and the update would fail to launch.
          # Symlinks are stored as symlinks (bsdtar does not follow them), which
          # the payload needs: python/bin/python3 and llama.cpp's libggml chain
          # are links, and dereferencing them breaks the seal as well.
          rm -f "$UPDATER" "$UPDATER_SIG"
          COPYFILE_DISABLE=1 tar -czf "$UPDATER" \
            -C "$(dirname "$APP")" "$(basename "$APP")"

          # Prove the round trip preserved the signature, on the artifact itself
          # rather than on the directory it was made from.
          check="$RUNNER_TEMP/updater-check"
          rm -rf "$check"
          mkdir -p "$check"
          tar -xzf "$UPDATER" -C "$check"
          extracted="$(find "$check" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$extracted"
          test -x "$extracted/Contents/Resources/runtime/python/bin/python3"
          codesign --verify --deep --strict --verbose=2 "$extracted"
          rm -rf "$check"

          # The updater signature is over the new bytes. This is the minisign key
          # shipped apps check before they install anything, so a stale signature
          # is a failed update, not a warning.
          npx --prefix studio tauri signer sign "$UPDATER"
          test -s "$UPDATER_SIG"
          python3 - "$UPDATER_SIG" <<'PY'
          import base64
          import binascii
          import pathlib
          import sys

          # The same shape "Generate versioned updater metadata" will demand in
          # publish-release, checked here where the failure names this step.
          value = pathlib.Path(sys.argv[1]).read_text(encoding = "utf-8").strip()
          try:
              decoded = base64.b64decode(value, validate = True)
          except (binascii.Error, ValueError) as error:
              sys.exit(f"the regenerated updater signature is not base64: {error}")
          if not decoded.startswith(b"untrusted comment:") or b"\ntrusted comment:" not in decoded:
              sys.exit("the regenerated updater signature is not a minisign signature")
          print("updater signature regenerated and well formed")
          PY
          ls -l "$UPDATER" "$UPDATER_SIG"

      - name: Rebuild the macOS disk image around the signed app
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APP: ${{ steps.macos_bundle.outputs.app_path }}
          DMG: ${{ steps.macos_bundle.outputs.dmg_path }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Converted, grown, written into and converted back, rather than
          # recreated: tauri's image carries a background, a window size, icon
          # positions and the /Applications symlink, all encoded in a .DS_Store
          # that `hdiutil create -srcfolder` would not reproduce. Same approach as
          # scripts/inject_macos_runtime.sh takes for the dev build, except that
          # what goes in is the signed app rather than a payload directory.
          work="$RUNNER_TEMP/dmg-rebuild"
          rm -rf "$work"
          mkdir -p "$work/mnt"
          rw="$work/rw.dmg"
          trap 'hdiutil detach "$work/mnt" -quiet >/dev/null 2>&1 || true' EXIT

          hdiutil convert "$DMG" -format UDRW -o "$rw" -quiet
          app_mb="$(du -sm "$APP" | cut -f1)"
          image_mb="$(du -sm "$rw" | cut -f1)"
          target_mb=$(( app_mb + image_mb + 512 ))
          echo "growing the image to ${target_mb}m (app ${app_mb}m + image ${image_mb}m + slack)"
          hdiutil resize -size "${target_mb}m" "$rw" >/dev/null

          hdiutil attach "$rw" -nobrowse -mountpoint "$work/mnt" -quiet
          mounted="$(find "$work/mnt" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$mounted" ]; then
            echo "::error::no .app inside the disk image tauri produced" >&2
            exit 1
          fi
          if [ "$(basename "$mounted")" != "$(basename "$APP")" ]; then
            echo "::error::the image holds $(basename "$mounted") but the signed app is $(basename "$APP"); the .DS_Store layout is keyed by name" >&2
            exit 1
          fi
          # ditto, not cp -R: it preserves the symlinks, permissions and extended
          # attributes the signature depends on.
          rm -rf "$mounted"
          ditto "$APP" "$mounted"
          codesign --verify --deep --strict --verbose=2 "$mounted"
          test -x "$mounted/Contents/Resources/runtime/python/bin/python3"
          hdiutil detach "$work/mnt" -quiet

          # ULFO (lzfse) rather than UDZO (zlib): measurably smaller for a payload
          # that is mostly already-compressed wheels and dylibs, and readable on
          # every macOS this bundle targets. Matches the dev build's image.
          hdiutil convert "$rw" -format ULFO -o "$work/out.dmg" -quiet
          mv "$work/out.dmg" "$DMG"

          # The bundler used to sign the image; nothing does now unless this does,
          # and notarization requires a signature with a secure timestamp. The
          # notarization step's first gate is `codesign --verify` on this file, so
          # a silent failure here stops the release there.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "rebuilt $(du -sh "$DMG" | cut -f1) $DMG"

      # ── macOS: notarize + staple the disk image itself ──
      # This step exists because tauri-bundler notarized and stapled the .app but
      # only codesigned the .dmg it wrapped around it (tauri-apps/tauri#7533): the
      # disk image users actually download shipped signed but without a
      # notarization ticket, so Gatekeeper had to phone home to clear it and
      # blocked it outright offline.
      #
      # Since the bundled runtime landed, tauri signs and notarizes nothing on
      # this leg (see "Build macOS app"), and this is the ONLY notarization the
      # release performs. That is deliberate rather than an omission. The ticket
      # Apple issues for a disk image covers the code nested inside it, so the app
      # a user drags out of the image is covered by the ticket stapled here. The
      # updater tarball is not, so an update installed through the updater lands a
      # signed, hardened, but unstapled app -- which macOS accepts, because the
      # updater writes the bundle itself and never sets a quarantine attribute, so
      # no Gatekeeper assessment happens. What protects that path is the minisign
      # signature the updater checks before it installs anything, and "Rebuild the
      # macOS updater artifact from the signed app" regenerates it over the signed
      # bytes.
      #
      # Everything below is unchanged, and its first gate still holds: the image
      # arriving here must already be signed, which is now the rebuild step's job
      # rather than the bundler's.
      - name: Notarize final macOS disk image
        if: matrix.platform == 'macos-latest'
        shell: bash
        # `--timeout` below caps the polling, but not the upload that precedes
        # it. Without a step-level backstop a stuck Notary service would burn
        # the whole job budget, so cap it tighter than the job here.
        timeout-minutes: 45
        env:
          ARTIFACT_PATHS: ${{ steps.build_macos.outputs.artifactPaths }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path="$(
            python3 <<'PY'
          import json
          import os
          import sys

          raw_paths = os.environ.get('ARTIFACT_PATHS', '')
          try:
              artifact_paths = json.loads(raw_paths)
          except json.JSONDecodeError as error:
              sys.exit(f'Invalid tauri-action artifactPaths output: {error}')
          if not isinstance(artifact_paths, list):
              sys.exit('tauri-action artifactPaths must be a JSON list')
          matches = [
              path
              for path in artifact_paths
              if isinstance(path, str) and path.lower().endswith('.dmg')
          ]
          if len(matches) != 1:
              sys.exit(f'Expected exactly one final DMG from tauri-action, found {len(matches)}')
          print(matches[0])
          PY
          )"

          # First gate, before the multi-minute upload: the image is signed by
          # "Rebuild the macOS disk image around the signed app", so an unsigned
          # image here means that step silently did nothing.
          codesign --verify --verbose=2 "$dmg_path"

          # notarytool has no environment or stdin form for --password, so the
          # credentials are visible in argv and in the process table. That is
          # the accepted tradeoff on a single-tenant ephemeral runner;
          # --keychain-profile only moves the same arguments one command
          # earlier, and the one form without argv secrets is App Store Connect
          # API key auth, which needs a different secret type.
          submit_status=0
          submission="$(
            xcrun notarytool submit "$dmg_path" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json \
              --timeout 30m \
              --wait
          )" || submit_status=$?
          printf '%s\n' "$submission"
          submission_id="$(
            printf '%s' "$submission" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))' \
              2>/dev/null
          )" || submission_id=""
          submission_result="$(
            printf '%s' "$submission" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))' \
              2>/dev/null
          )" || submission_result=""
          if [ "$submit_status" -ne 0 ] || [ "$submission_result" != "Accepted" ]; then
            # The service verdict is part of the JSON contract, independently
            # of the command's exit code. Fetch the log whenever the response
            # identifies a failed submission.
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" >&2 || true
            fi
            if [ "$submit_status" -ne 0 ]; then
              exit "$submit_status"
            fi
            echo "Notarization did not return Accepted (status=${submission_result:-missing})." >&2
            exit 1
          fi

          # Apple's ticket lookup can lag behind an Accepted verdict or time
          # out against CloudKit. Retry it without weakening final validation.
          for attempt in 1 2 3; do
            staple_status=0
            xcrun stapler staple "$dmg_path" || staple_status=$?
            if [ "$staple_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$staple_status"
            fi
            delay=$((15 * attempt))
            echo "::warning::Stapling failed (attempt $attempt/3); retrying in ${delay}s."
            sleep "$delay"
          done
          # Stapling rewrites the image. `stapler validate` is what proves the
          # offline case, since spctl can clear an unstapled image from an
          # online CDN check; spctl then gives the verdict a user's machine
          # would reach.
          xcrun stapler validate "$dmg_path"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"

      # ── Windows: build + sign ──
      # install.ps1 is a bundle resource the bundler never signs, yet the app
      # runs it first. Sign before the build packs it in; the signature is an
      # appended comment block, so the repo copy for `irm ... | iex` is unaffected.
      - name: Sign the bundled install script
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: |
          $script = (Resolve-Path 'install.ps1').Path
          studio/src-tauri/windows/sign-with-trusted-signing.ps1 -Path $script
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not sign install.ps1 (exit $LASTEXITCODE)"; exit 1 }
          $sig = Get-AuthenticodeSignature $script
          Write-Host "install.ps1 -> $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Host "::error::install.ps1 is $($sig.Status) after signing"; exit 1 }

      # ── Windows: pin the WebView2 bootstrapper the installer embeds ──
      # `bundle > windows > webviewInstallMode: embedBootstrapper` makes
      # tauri-bundler embed Microsoft's Evergreen WebView2 bootstrapper in the
      # NSIS installer. The bundler fetched it from
      # https://go.microsoft.com/fwlink/p/?LinkId=2124703 -- a link whose target
      # Microsoft rotates -- and, unlike every other file it downloads (NSIS 3.11
      # and nsis_tauri_utils.dll are both hash-verified), it verified nothing. So
      # the last unpinned build input ended up inside a signed installer that is
      # also the auto-updater payload, trusted purely on TLS, and differing
      # between two builds of the same commit.
      #
      # tauri-bundler 2.8.1 (the bundler in the pinned tauri-cli 2.10.1) resolves
      # it in bundle/windows/util.rs as:
      #
      #   let file_path = base_path.join("MicrosoftEdgeWebview2Setup.exe");
      #   if !file_path.exists() { fs::write(&file_path, download(URL)?)?; }
      #
      # so seeding that path with a verified copy makes the bundler use ours and
      # download nothing. `base_path` is the bundler's tools directory:
      # `dirs::cache_dir()/tauri`, i.e. %LOCALAPPDATA%\tauri, because
      # `bundle > useLocalToolsDir` is false. Nothing in the config can hand the
      # bundler a local bootstrapper -- the five webviewInstallMode variants are
      # skip / downloadBootstrapper / embedBootstrapper / offlineInstaller /
      # fixedRuntime{path} -- so the cache seed is the supported seam, and
      # "Verify the embedded WebView2 bootstrapper" below proves it was taken.
      #
      # The URL is the immutable per-version target the fwlink redirects to, so
      # the pin only moves when we move it. The SHA-256 is the integrity gate and
      # fails closed, same shape as the AppImage toolchain and trusted-signing-cli
      # pins above.
      #
      # This pins the ~1.8MB *bootstrapper*, not the WebView2 runtime. The file is
      # Microsoft Edge Update Setup 1.3.257.13, whose only job is to fetch the
      # current Evergreen runtime at install time, so users still receive WebView2
      # security updates. (`fixedRuntime` would pin the runtime itself and take
      # that away; deliberately not used.)
      #
      # To bump, re-record the digest from the artifact itself:
      #   curl -sSIL 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' | grep -i '^location'
      #   curl -fsSL '<resolved url>' | sha256sum
      # then update WEBVIEW2_BOOTSTRAPPER_URL / WEBVIEW2_BOOTSTRAPPER_SHA256 in
      # both Windows steps here (they must agree), the copies in the "Verify
      # desktop updater and Linux package config" guard, and
      # tests/security/test_release_desktop_webview2.py.
      - name: Pin Windows WebView2 bootstrapper
        if: matrix.platform == 'windows-latest'
        # Explicit, like every other Windows step here; -MaximumRetryCount is
        # PowerShell 6+ only and must not come from a runner default.
        shell: pwsh
        env:
          WEBVIEW2_BOOTSTRAPPER_URL: "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/09d01e8e-f1ac-43a6-b5a0-282e0778a4b6/MicrosoftEdgeWebview2Setup.exe"
          WEBVIEW2_BOOTSTRAPPER_SHA256: "be695eb3732a94e181f008ab5cf6ee650f8644676e87f9e02b6ab0d02f2ea08e"
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:LOCALAPPDATA) {
            Write-Output "::error::LOCALAPPDATA is unset, so the tauri-bundler tools directory cannot be located. Refusing to build an installer that would embed an unverified WebView2 bootstrapper."
            exit 1
          }
          $toolsDir = Join-Path $env:LOCALAPPDATA "tauri"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          $seeded = Join-Path $toolsDir "MicrosoftEdgeWebview2Setup.exe"

          # Download to a staging path, verify there, and only then move it into
          # the bundler's cache. A partial or substituted download must never
          # exist at $seeded even briefly, because that is the exact path the
          # bundler treats as "already have it, no need to fetch".
          $stage = Join-Path $env:RUNNER_TEMP "webview2"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $dest = Join-Path $stage "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri $env:WEBVIEW2_BOOTSTRAPPER_URL -OutFile $dest -MaximumRetryCount 3 -RetryIntervalSec 5

          $actual = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLower()
          $expected = $env:WEBVIEW2_BOOTSTRAPPER_SHA256.ToLower()
          if ($actual -ne $expected) {
            Remove-Item -Force $dest
            Write-Output "::error::WebView2 bootstrapper digest mismatch, refusing to embed an unverified Microsoft binary in the installer. Expected $expected, got $actual. Re-pin WEBVIEW2_BOOTSTRAPPER_URL and WEBVIEW2_BOOTSTRAPPER_SHA256 deliberately if Microsoft rotated the Evergreen bootstrapper."
            exit 1
          }

          # -Force overwrites: a warm runner image (or a restored cache) could
          # already hold an unverified copy at this path, and that copy would win
          # the bundler's existence check.
          Move-Item -Force -Path $dest -Destination $seeded
          Write-Output "verified WebView2 bootstrapper sha256=$actual"
          Write-Output "seeded tauri-bundler tools directory: $seeded"
          "WEBVIEW2_BOOTSTRAPPER_PATH=$seeded" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows app
        id: build_windows
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key is not password protected, and no secret of this name
          # exists, so this expression has always resolved to the empty string.
          # Stated literally rather than left pointing at a secret that is not
          # there: the value is unchanged, but it no longer reads as configuration
          # someone forgot to set. Empty is not the same as unset here -- tauri
          # prompts for a password when the variable is absent, which would hang
          # the job, so the line stays.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        with:
          projectPath: studio
          tauriScript: npx --prefix . tauri
          args: -v ${{ matrix.args }}

      # ── Windows: prove the installer embedded the pinned bootstrapper ──
      # Seeding the bundler's cache is only as good as the assumption that the
      # bundler read it, and that assumption is a tauri-bundler implementation
      # detail that a CLI bump could change silently. So check the result rather
      # than the intent: tauri-bundler renders the NSIS script it hands to
      # makensis into target/<profile>/nsis/<arch>/installer.nsi, and the
      # embedBootstrapper branch of that script embeds the file named by
      #
      #   !define WEBVIEW2BOOTSTRAPPERPATH "<absolute path>"
      #
      # with `File "/oname=$TEMP\MicrosoftEdgeWebview2Setup.exe" ...`. Reading
      # that path back out and hashing it is direct evidence of which bytes went
      # into the installer, independent of where the bundler chose to cache them.
      # Runs before the 20-minute Defender scan so a miss fails fast.
      - name: Verify the embedded WebView2 bootstrapper
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WEBVIEW2_BOOTSTRAPPER_SHA256: "be695eb3732a94e181f008ab5cf6ee650f8644676e87f9e02b6ab0d02f2ea08e"
        run: |
          $ErrorActionPreference = "Stop"
          # target/<profile>/nsis/<arch>/ without --target, target/<triple>/<profile>/...
          # with one. Globbed rather than -Recurse: the target directory holds
          # hundreds of thousands of build artifacts.
          $scripts = @(Get-ChildItem -File -ErrorAction SilentlyContinue -Path @(
            "studio/src-tauri/target/*/nsis/*/installer.nsi",
            "studio/src-tauri/target/*/*/nsis/*/installer.nsi"
          ))
          if ($scripts.Count -ne 1) {
            Write-Output "::error::Expected exactly one rendered NSIS script under studio/src-tauri/target, found $($scripts.Count). Cannot prove which WebView2 bootstrapper the installer embedded."
            exit 1
          }
          $nsi = $scripts[0].FullName
          $text = Get-Content -Raw -Path $nsi

          $modeMatch = [regex]::Match($text, '(?m)^!define\s+INSTALLWEBVIEW2MODE\s+"([^"]*)"')
          if (-not $modeMatch.Success -or $modeMatch.Groups[1].Value -ne "embedBootstrapper") {
            Write-Output "::error::Rendered NSIS script does not install WebView2 via embedBootstrapper (got '$($modeMatch.Groups[1].Value)'), so this check cannot vouch for the embedded bootstrapper. Re-review the pin if webviewInstallMode changed."
            exit 1
          }

          $pathMatch = [regex]::Match($text, '(?m)^!define\s+WEBVIEW2BOOTSTRAPPERPATH\s+"([^"]*)"')
          if (-not $pathMatch.Success) {
            Write-Output "::error::Rendered NSIS script declares no WEBVIEW2BOOTSTRAPPERPATH; refusing to publish an installer whose WebView2 bootstrapper cannot be identified."
            exit 1
          }
          # tauri-bundler escapes NSIS metacharacters when rendering the template
          # ('"' -> '$\"', '$' -> '$$'); undo the two a Windows path can contain.
          $embedded = $pathMatch.Groups[1].Value.Replace('$\"', '"').Replace('$$', '$')
          if (-not (Test-Path -LiteralPath $embedded)) {
            Write-Output "::error::Rendered NSIS script embedded '$embedded', which no longer exists, so its digest cannot be checked."
            exit 1
          }

          # The seeded path is where the pinned copy was placed. A different path
          # means the bundler cached elsewhere and fetched its own copy.
          if (-not $env:WEBVIEW2_BOOTSTRAPPER_PATH) {
            Write-Output "::error::WEBVIEW2_BOOTSTRAPPER_PATH is unset; 'Pin Windows WebView2 bootstrapper' did not run."
            exit 1
          }
          $seeded = (Resolve-Path -LiteralPath $env:WEBVIEW2_BOOTSTRAPPER_PATH).Path
          $embeddedResolved = (Resolve-Path -LiteralPath $embedded).Path
          if ($embeddedResolved -ne $seeded) {
            Write-Output "::error::The installer embedded '$embeddedResolved' but the pinned bootstrapper was seeded at '$seeded'. tauri-bundler fetched its own unverified copy; re-check bundle/windows/util.rs for the tauri-cli version in studio/package-lock.json."
            exit 1
          }

          $actual = (Get-FileHash -Path $embeddedResolved -Algorithm SHA256).Hash.ToLower()
          $expected = $env:WEBVIEW2_BOOTSTRAPPER_SHA256.ToLower()
          if ($actual -ne $expected) {
            Write-Output "::error::The WebView2 bootstrapper embedded in the installer is not the pinned one. Expected $expected, got $actual."
            exit 1
          }
          Write-Output "installer embedded the pinned WebView2 bootstrapper sha256=$actual from $embeddedResolved"

      # ── Windows: scan the signed bundles with Defender before publishing ──
      # 0.1.512-beta shipped a "Trojan:Win32/Wacatac.B!ml" false positive nothing
      # here caught. The runner disables Defender and excludes both drive roots,
      # so restore it and verify the restore took; "!ml" is a cloud verdict, so
      # MAPS must be on; MpCmdRun exit codes are ambiguous, so read the output.
      - name: Scan Windows bundles with Defender
        if: matrix.platform == 'windows-latest'
        # A custom MpCmdRun scan defaults to a one-day timeout.
        timeout-minutes: 20
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.build_windows.outputs.artifactPaths }}
        run: |
          $ErrorActionPreference = 'Continue'

          $atp = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection'
          if (Test-Path $atp) { Remove-ItemProperty -Path $atp -Name 'ForceDefenderPassiveMode' -ErrorAction SilentlyContinue }
          Start-Service -Name WinDefend -ErrorAction SilentlyContinue

          foreach ($x in @((Get-MpPreference).ExclusionPath)) {
            if ($x) { Remove-MpPreference -ExclusionPath $x -ErrorAction SilentlyContinue }
          }
          Set-MpPreference `
            -DisableRealtimeMonitoring $false -DisableIOAVProtection $false `
            -DisableScriptScanning $false -DisableBehaviorMonitoring $false `
            -DisableArchiveScanning $false -MAPSReporting Advanced `
            -SubmitSamplesConsent SendAllSamples -CloudBlockLevel High `
            -CloudExtendedTimeout 50 -DisableBlockAtFirstSeen $false -ErrorAction Continue

          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $plat = Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform' -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
          if ($plat -and (Test-Path "$($plat.FullName)\MpCmdRun.exe")) { $mp = "$($plat.FullName)\MpCmdRun.exe" }
          Update-MpSignature -UpdateSource MicrosoftUpdateServer -ErrorAction Continue
          & $mp -SignatureUpdate 2>&1 | Write-Host

          # Read these defensively. A runner can come up with the Defender WMI
          # provider dead ("Provider load failure") and the service RPC endpoint
          # down (0x800106ba), which is how the platform incident on 2026-08-06
          # presented: the cmdlets throw, $status/$pref land null, and every check
          # below then reads as a misconfiguration it is not.
          $status = $null
          $pref = $null
          $unavailable = @()
          try { $status = Get-MpComputerStatus -ErrorAction Stop }
          catch { $unavailable += "Get-MpComputerStatus: $($_.Exception.Message)" }
          try { $pref = Get-MpPreference -ErrorAction Stop }
          catch { $unavailable += "Get-MpPreference: $($_.Exception.Message)" }
          if (-not $unavailable -and -not $status) { $unavailable += 'Get-MpComputerStatus returned nothing' }
          if (-not $unavailable -and -not $pref)   { $unavailable += 'Get-MpPreference returned nothing' }

          # Absent scanner vs. bad verdict: only a missing scanner may skip; a
          # misconfigured one or a real detection still fails. Dead cmdlets are not
          # a missing scanner - WMI and service RPC back them, MpCmdRun talks to
          # the engine directly - and conflating the two shipped three releases
          # unscanned since 2026-08-06. Let the EICAR control below decide.
          $cmdletsDown = [bool]$unavailable
          if ($cmdletsDown) {
            Write-Host "::warning::Defender cmdlets are unavailable on this runner ($($unavailable -join '; ')); configuration cannot be read or enforced. Falling back to a direct MpCmdRun scan."
          }
          if ($status) {
            Write-Host "engine $($status.AMEngineVersion), signatures $($status.AntivirusSignatureVersion) ($($status.AntivirusSignatureLastUpdated))"
          }

          # Set-MpPreference can return cleanly and still be ignored, so verify.
          # Split by whether the gap invalidates the verdict: cloud-delivered
          # protection is inactive without active mode, MAPS and block-at-first-
          # sight, and "!ml" is a cloud verdict, so a clean result without them
          # cannot see what this gate exists to catch. Leftover exclusions only
          # weaken it, since -DisableRemediation ignores file exclusions.
          # Guard each check on the cmdlet that read it, not a blanket flag: the
          # two fail independently (live WMI call vs. registry), so a blanket
          # guard drops a readable $pref's MAPS and block-at-first-sight checks.
          $fatal = @()
          $degraded = @()
          if ($status) {
            if (-not $status.RealTimeProtectionEnabled) { $fatal += "RealTimeProtectionEnabled=false (AMRunningMode=$($status.AMRunningMode))" }
          }
          if ($pref) {
            if ([int]$pref.MAPSReporting -ne 2)         { $fatal += "MAPSReporting=$($pref.MAPSReporting), expected 2 (Advanced)" }
            if ($pref.DisableBlockAtFirstSeen)          { $fatal += 'DisableBlockAtFirstSeen=true' }
            if ([int]$pref.SubmitSamplesConsent -ne 3)  { $degraded += "SubmitSamplesConsent=$($pref.SubmitSamplesConsent), expected 3 (SendAllSamples)" }
            if ([int]$pref.CloudBlockLevel -eq 0)       { $degraded += "CloudBlockLevel=$($pref.CloudBlockLevel), expected High" }
            if ($pref.ExclusionPath)                    { $degraded += "exclusions remain: $($pref.ExclusionPath -join ',')" }
          }

          # Configuration is not connectivity. Retried, so one network blip does
          # not block a release.
          $maps = $false
          foreach ($try in 1..3) {
            $mapsOut = (& $mp -ValidateMapsConnection 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { $maps = $true; break }
            Write-Host "  MAPS check $try failed: $($mapsOut.Trim())"
            Start-Sleep -Seconds (5 * $try)
          }
          # Cmdlets down: losing the cloud degrades rather than blocks the release
          # outright - signature detections still fire, only "!ml" verdicts do not.
          if (-not $maps) {
            if ($cmdletsDown) { $degraded += 'cannot reach the Defender cloud service, so "!ml" cloud verdicts cannot fire' }
            else              { $fatal += 'cannot reach the Defender cloud service' }
          }

          # Positive control: clean and broken-scanner look identical. Split into
          # fragments so this file is not itself a sample.
          $eicarPath = Join-Path $env:RUNNER_TEMP 'defender-selftest.com'
          # Real-time protection may block the write; that is the control passing.
          $controlPassed = $false
          try {
            [System.IO.File]::WriteAllText(
              $eicarPath,
              'X5O!P%@AP[4\PZX54(P^)7CC)7}' + '$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!' + '$H+H*')
          } catch { }
          if (Test-Path $eicarPath) {
            $controlOut = (& $mp -Scan -ScanType 3 -File $eicarPath -DisableRemediation 2>&1 | Out-String)
            $controlPassed = [bool](($controlOut -match 'found\s+\d+\s+threat') -or ($controlOut -match 'EICAR'))
            # Remediation is asynchronous: the sample can pass Test-Path and still
            # be quarantined mid-scan. Vanishing means the control fired, not a
            # missing scanner - nothing else deletes it and -DisableRemediation
            # stops this scan from doing so, so a dead engine leaves it on disk.
            if (-not $controlPassed -and -not (Test-Path $eicarPath)) {
              Write-Host 'EICAR positive control quarantined before the scan could open it; real-time protection is live.'
              $controlPassed = $true
            }
            Remove-Item $eicarPath -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host 'EICAR positive control blocked on write; real-time protection is live.'
            $controlPassed = $true
          }
          # The real test of whether a scanner exists, and the only one left with
          # the cmdlets down: a control that does not fire means MpCmdRun cannot
          # scan either, so skip as before rather than fail on a missing engine.
          if (-not $controlPassed) {
            if ($cmdletsDown) {
              Write-Host "::warning::Defender is unavailable on this runner ($($unavailable -join '; ')) and MpCmdRun could not fire the EICAR positive control either; skipping the bundle scan. This is a missing scanner, not a clean verdict - these bundles were not scanned."
              exit 0
            }
            $fatal += 'EICAR positive control did not fire'
          }
          if ($cmdletsDown) {
            Write-Host 'EICAR positive control fired via MpCmdRun; scanning with the cmdlets unavailable.'
          }

          if ($degraded) {
            Write-Host "::warning::Defender is not fully configured on this runner ($($degraded -join '; ')). Scanning anyway."
          }
          if ($fatal) {
            Write-Host "::error::Defender cannot give an authoritative verdict here ($($fatal -join '; ')); refusing to publish on a scan that cannot see the detection class this gate exists for"
            exit 1
          }

          # Fatal, not a warning: exiting 0 here would pass an unscanned release.
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_PATHS)) {
            Write-Host '::error::tauri-action produced no artifactPaths output; refusing to publish unscanned bundles'
            exit 1
          }
          try {
            $paths = @($env:ARTIFACT_PATHS | ConvertFrom-Json)
          } catch {
            Write-Host "::error::could not parse artifactPaths ($($_.Exception.Message)); refusing to publish unscanned bundles"
            exit 1
          }
          $missing = @($paths | Where-Object { $_ -and -not (Test-Path $_ -PathType Leaf) })
          if ($missing) {
            Write-Host "::error::artifactPaths lists files that do not exist: $($missing -join ', ')"
            exit 1
          }
          $paths = @($paths | Where-Object { $_ })
          if (-not $paths) {
            Write-Host '::error::artifactPaths resolved to an empty list; refusing to publish unscanned bundles'
            exit 1
          }
          Write-Host "scanning $($paths.Count) Windows bundle(s)"

          # Scan copies: real-time protection is live, so a detection would delete
          # the release artifact itself. Copies double as submission material,
          # since clearance is per hash and a rebuild hashes differently.
          $work = Join-Path $env:RUNNER_TEMP 'defender-scan'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # Real-time protection acts on open and on write, and -DisableRemediation
          # governs only the explicit scan, so a hit would quarantine the bundle
          # mid-copy and leave the failure handler nothing to upload. Exempt both
          # ends of the copy. The verdict is unaffected: -DisableRemediation
          # ignores file exclusions. Left in place, since the copies must survive
          # until the failure-gated preserve step runs.
          $exclude = @($work) + @($paths | Split-Path -Parent | Sort-Object -Unique)
          Add-MpPreference -ExclusionPath $exclude -ErrorAction Continue

          # -ErrorAction Continue does not stop on a rejected exclusion, so read
          # it back. Defender stores these verbatim; normalise anyway.
          # Keyed on the reading cmdlet, not the blanket flag: $pref can be live
          # while $status is down. With $pref unreadable there is nothing to read
          # back, and a mid-scan quarantine still fails below as unscannable.
          if ($pref) {
            $norm = { param($p) $p.TrimEnd('\').ToLowerInvariant() }
            $applied = @(@((Get-MpPreference).ExclusionPath) | ForEach-Object { & $norm $_ })
            $notApplied = @($exclude | Where-Object { $applied -notcontains (& $norm $_) })
            if ($notApplied) {
              Write-Host "::error::Defender refused these exclusions: $($notApplied -join ', '); a detection would quarantine the bundle mid-copy and leave nothing to submit"
              exit 1
            }
          }

          $detected = @()
          $unscanned = @()
          foreach ($f in $paths) {
            $leaf = Split-Path $f -Leaf
            $copy = Join-Path $work $leaf
            Copy-Item $f $copy -Force

            # Block-at-first-sight only consults the cloud for internet-zone files,
            # so stamp mark-of-the-web or this is not the user path.
            "[ZoneTransfer]`nZoneId=3" | Set-Content -Path $copy -Stream Zone.Identifier -Encoding Ascii -ErrorAction SilentlyContinue

            $out = & $mp -Scan -ScanType 3 -File $copy -DisableRemediation 2>&1
            $code = $LASTEXITCODE
            $text = ($out | Out-String)
            $out | ForEach-Object { Write-Host "  $_" }

            # Exit 2 is a detection or a scan error, and 0 is the only documented
            # clean code, so read the output text too.
            if ($text -match 'found\s+\d+\s+threat') {
              $names = @([regex]::Matches($text, '((?:Trojan|Virus|Worm|Backdoor|Ransom|HackTool|PUA|Behavior|Program|Misleading)[:\w\./!\-]+)') |
                         ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
              if (-not $names) { $names = @('unnamed detection') }
              Write-Host "::error::Defender flagged ${leaf}: $($names -join ', ')"
              $detected += "$leaf [$($names -join ', ')]"
            } elseif ($code -ne 0) {
              Write-Host "::error::Defender did not complete a scan of $leaf (MpCmdRun exit $code)"
              $unscanned += "$leaf [exit $code]"
            } else {
              Write-Host "clean: $leaf"
            }
          }

          if ($unscanned) {
            Write-Host "::error::Refusing to publish bundles Defender could not scan: $($unscanned -join '; ')"
          }
          if ($detected) {
            Write-Host "::error::Refusing to publish a Windows bundle Defender flags: $($detected -join '; ')"
            Write-Host 'If this is a false positive, submit it at https://www.microsoft.com/en-us/wdsi/filesubmission (Software developer -> incorrectly detected) and re-run once cleared.'
          }
          if ($detected -or $unscanned) { exit 1 }
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "All $($paths.Count) Windows bundle(s) scanned clean."

      # Later steps carry an implicit success(), so on a detection the flagged
      # bundle would be discarded with the runner.
      - name: Preserve flagged Windows bundles
        if: failure() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flagged-windows-bundles-${{ matrix.artifact }}
          path: ${{ runner.temp }}/defender-scan/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      # ── Windows: every executable in the bundle must be signed ──
      # NSIS runs its plugin DLLs from $PLUGINSDIR; signing the installer misses them.
      - name: Verify every executable in the Windows bundles is signed
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.build_windows.outputs.artifactPaths }}
        run: |
          $paths = @($env:ARTIFACT_PATHS | ConvertFrom-Json) |
                   Where-Object { $_ -like '*-setup.exe' }
          if (-not $paths) { Write-Host '::error::no Windows installer to verify'; exit 1 }
          .github/scripts/assert-bundle-signed.ps1 -Path $paths

      # ── Windows: assemble a Microsoft false-positive submission packet ──
      # The WDSI portal is a web form with no API, so this cannot be automated,
      # but pre-filling the lookups makes submitting a build take seconds.
      - name: Prepare Microsoft submission packet
        if: (success() || failure()) && matrix.platform == 'windows-latest' && steps.build_windows.outcome == 'success'
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.build_windows.outputs.artifactPaths }}
        run: |
          $paths = @($env:ARTIFACT_PATHS | ConvertFrom-Json) |
                   Where-Object { $_ -like '*-setup.exe' }
          $md = @(
            '## Microsoft submission packet',
            '',
            'Submit at <https://www.microsoft.com/en-us/wdsi/filesubmission> before announcing this release.',
            'Choose **Software developer** -> **Incorrectly detected as malware/malicious**.',
            'The portal caps uploads at 50 MB. Clearance is per hash, so never substitute a',
            'different file: for a larger bundle use <https://security.microsoft.com/reportsubmission>,',
            'which takes 500 MB.',
            ''
          )
          foreach ($f in $paths) {
            $item = Get-Item $f
            $sig = Get-AuthenticodeSignature $f
            $md += "### $($item.Name)"
            $md += ''
            $md += '| field | value |'
            $md += '|---|---|'
            $md += "| SHA-256 | ``$((Get-FileHash -Algorithm SHA256 $f).Hash)`` |"
            $md += "| SHA-1 | ``$((Get-FileHash -Algorithm SHA1 $f).Hash)`` |"
            $md += "| Size | $($item.Length) bytes |"
            $md += "| Signature | $($sig.Status) |"
            $md += "| Signer | $($sig.SignerCertificate.Subject) |"
            $md += "| Product | $($env:APP_VERSION) |"
            $md += ''
          }
          $md += '> Clearance is per hash. It fixes the release you submit and nothing after it,'
          $md += '> so this is a complement to signing, not a substitute.'
          $out = "$env:RUNNER_TEMP\ms-submission-packet.md"
          $md -join "`n" | Out-File $out -Encoding utf8
          $md -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host ($md -join "`n")

      # ── Lockfile immutability, part 2 of 2 ──
      # The bundles are built by now, so any lockfile rewrite the build itself
      # performed (a cargo invocation without --locked, a stray `npm install`
      # inside a build script) has already happened. Fail the release loudly
      # rather than shipping binaries whose dependency set no longer matches the
      # reviewed one. Baselines: HEAD for the two npm lockfiles, and the
      # post-patch snapshot from part 1 for Cargo.lock.
      - name: Verify the build rewrote no lockfile
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          git diff --exit-code -- studio/package-lock.json studio/frontend/package-lock.json
          "$PYTHON" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          def digest(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes().replace(b'\r\n', b'\n')).hexdigest()

          snapshot_path = pathlib.Path(os.environ['RUNNER_TEMP'], 'lockfile-digests.json')
          if not snapshot_path.is_file():
              sys.exit('No lockfile digest snapshot; "Snapshot lockfile digests" did not run')
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))

          drifted = {
              path: (recorded, digest(pathlib.Path(path)))
              for path, recorded in sorted(snapshot.items())
              if digest(pathlib.Path(path)) != recorded
          }
          if drifted:
              for path, (recorded, actual) in drifted.items():
                  print(f'{path}: {recorded} -> {actual}', file=sys.stderr)
              sys.exit(
                  'The build rewrote a lockfile, so these bundles were not built '
                  'from the reviewed dependency set.'
              )
          print('lockfiles unchanged since the release version patch')
          PY

      # ── Build provenance: what this leg actually built with ──
      # Every version below exists only in the runner log today, and logs
      # expire. publish-release merges the three legs' records into one
      # build-inputs.json release asset, which outlives them.
      - name: Record build inputs
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT_KEY: ${{ matrix.artifact }}
          # The manifest is read out of the SIGNED app bundle, not out of the
          # staging directory it was assembled in, so what lands in the record is
          # what shipped. Empty on the legs that ship no payload.
          BUNDLED_RUNTIME_APP: ${{ steps.macos_bundle.outputs.app_path }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          # Collected in the shell rather than from Python's subprocess: `npx`
          # and `npm` are .cmd shims on Windows and are only reliably resolvable
          # through a shell. rustc/cargo are read from studio/src-tauri so
          # rust-toolchain.toml governs which toolchain answers.
          RUSTC_VERSION="$(cd studio/src-tauri && rustc -V)"
          CARGO_VERSION="$(cd studio/src-tauri && cargo -V)"
          NODE_VERSION="$(node -v)"
          NPM_VERSION="$(npm -v)"
          TAURI_CLI_VERSION="$(npx --prefix studio tauri --version)"
          COMMIT_SHA="$(git rev-parse HEAD)"
          export RUSTC_VERSION CARGO_VERSION NODE_VERSION NPM_VERSION TAURI_CLI_VERSION COMMIT_SHA
          "$PYTHON" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import sys

          workflow = pathlib.Path('.github/workflows/release-desktop.yml').read_text(encoding='utf-8')

          # Read the pins out of the workflow itself rather than restating them:
          # a copy here would silently go stale the next time one is bumped.
          pinned_actions = sorted({
              match.group(1)
              for match in re.finditer(r'^\s*-?\s*uses:\s*(\S+@[0-9a-f]{40})', workflow, re.M)
          })
          pinned_downloads = {
              match.group(1): match.group(2)
              for match in re.finditer(
                  r'^\s*([A-Z][A-Z0-9_]*(?:_URL|_SHA256)):\s*"([^"]+)"', workflow, re.M
              )
          }

          toolchain = pathlib.Path('studio/src-tauri/rust-toolchain.toml').read_text(encoding='utf-8')
          channel = re.search(r'^\s*channel\s*=\s*"([^"]+)"', toolchain, re.M)
          if not channel:
              sys.exit('studio/src-tauri/rust-toolchain.toml declares no channel')
          channel = channel.group(1)
          if not re.fullmatch(r'\d+\.\d+(?:\.\d+)?', channel):
              sys.exit(
                  'Desktop releases must build on an exact rustc, not a moving channel: '
                  f'rust-toolchain.toml channel = "{channel}"'
              )
          rustc_version = os.environ['RUSTC_VERSION']
          # Proves the pin took effect on this runner. Without it a
          # rust-toolchain.toml that failed to apply would only show up as a
          # version string nobody read.
          if not rustc_version.startswith(f'rustc {channel} '):
              sys.exit(
                  f'rustc is {rustc_version!r}, not the pinned {channel} from '
                  'studio/src-tauri/rust-toolchain.toml'
              )

          def digest(path: str) -> str:
              return hashlib.sha256(
                  pathlib.Path(path).read_bytes().replace(b'\r\n', b'\n')
              ).hexdigest()

          record = {
              'artifact': os.environ['ARTIFACT_KEY'],
              'runner_label': os.environ['PLATFORM'],
              'runner': {
                  'os': os.environ.get('RUNNER_OS', ''),
                  'arch': os.environ.get('RUNNER_ARCH', ''),
                  'image_os': os.environ.get('ImageOS', ''),
                  'image_version': os.environ.get('ImageVersion', ''),
                  'platform': platform.platform(),
                  'machine': platform.machine(),
              },
              'commit': os.environ['COMMIT_SHA'],
              'source_date_epoch': os.environ.get('SOURCE_DATE_EPOCH', ''),
              'toolchain': {
                  'rust_toolchain_toml_channel': channel,
                  'rustc': rustc_version,
                  'cargo': os.environ['CARGO_VERSION'],
                  'node': os.environ['NODE_VERSION'],
                  'npm': os.environ['NPM_VERSION'],
                  'tauri_cli': os.environ['TAURI_CLI_VERSION'],
              },
              'lockfiles': {
                  path: digest(path)
                  for path in (
                      'studio/src-tauri/Cargo.lock',
                      'studio/package-lock.json',
                      'studio/frontend/package-lock.json',
                  )
              },
              'pinned_actions': pinned_actions,
              'pinned_downloads': pinned_downloads,
          }

          # ── The bundled runtime, for the legs that ship one ──
          # A shipped .dmg now contains a whole Python stack, and "which versions
          # were in it" has to be answerable from the release rather than from a
          # runner log that expires. BUNDLE_MANIFEST.json is exactly that answer:
          # every distribution and its version, the digest of every prebuilt
          # archive, and a `locks` map that already carries the SHA-256 of
          # darwin-arm64-bundle.lock.txt. So it is embedded whole, digested as
          # shipped, and nothing about the payload is restated here -- the same
          # reason pinned_downloads is scraped out of the workflow above instead of
          # being copied into it.
          app = os.environ.get('BUNDLED_RUNTIME_APP', '')
          if os.environ['PLATFORM'].startswith('macos') and not app:
              sys.exit(
                  'the macOS leg recorded no app bundle, so the bundled runtime cannot be '
                  'described; "Locate the built macOS bundle" must run before this step'
              )
          if app:
              manifest_path = pathlib.Path(app, 'Contents/Resources/runtime/BUNDLE_MANIFEST.json')
              if not manifest_path.is_file():
                  sys.exit(f'{manifest_path} is missing; the signed app ships no bundled runtime')
              manifest_bytes = manifest_path.read_bytes()
              manifest = json.loads(manifest_bytes)
              if manifest.get('incomplete'):
                  sys.exit(f'the shipped payload is incomplete: {manifest["incomplete"]}')
              bundle_lock = 'darwin-arm64-bundle.lock.txt'
              if bundle_lock not in manifest.get('locks', {}):
                  sys.exit(
                      f'BUNDLE_MANIFEST.json records no {bundle_lock}, so the release cannot '
                      'say which lock resolved the payload'
                  )
              record['bundled_runtime'] = {
                  'root': 'Contents/Resources/runtime',
                  'manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(),
                  'manifest': manifest,
                  # Recorded because a payload nobody signed is the failure this
                  # release path exists to prevent, so the count belongs with the
                  # digests rather than only in the signing step's log.
                  'signed_macho_count': int(os.environ.get('SIGNED_MACHO_COUNT', '0')),
              }
              if record['bundled_runtime']['signed_macho_count'] <= 0:
                  sys.exit('no Mach-O count was recorded, so nothing proves the payload was signed')

          out_dir = pathlib.Path(os.environ['RUNNER_TEMP'], 'build-inputs')
          out_dir.mkdir(parents=True, exist_ok=True)
          out = out_dir / f'build-inputs-{record["artifact"]}.json'
          out.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Upload build input record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Deliberately not `desktop-release-*`: publish-release and
          # virustotal-scan both merge that pattern into the bundle directory,
          # and a stray JSON there would fail the asset-set contract.
          name: desktop-build-inputs-${{ matrix.artifact }}
          path: ${{ runner.temp }}/build-inputs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Stage release assets
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.package_linux.outputs.artifactPaths || steps.build_macos.outputs.artifactPaths || steps.build_windows.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          "$PYTHON" <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import sys

          raw_paths = os.environ.get('ARTIFACT_PATHS', '')
          try:
              artifact_paths = json.loads(raw_paths)
          except json.JSONDecodeError as error:
              sys.exit(f'Invalid tauri-action artifactPaths output: {error}')
          if not isinstance(artifact_paths, list) or not artifact_paths:
              sys.exit('tauri-action did not return any release artifacts')

          destination = pathlib.Path(os.environ['RUNNER_TEMP'], 'desktop-release-assets')
          destination.mkdir(parents=True, exist_ok=True)
          base_name = f'Unsloth-Desktop-{os.environ["ASSET_VERSION"]}'
          suffix_names = (
              ('.app.tar.gz.sig', f'{base_name}-ARM64.app.tar.gz.sig'),
              ('.app.tar.gz', f'{base_name}-ARM64.app.tar.gz'),
              ('.AppImage.sig', f'{base_name}-Linux.AppImage.sig'),
              ('.AppImage', f'{base_name}-Linux.AppImage'),
              ('-setup.exe.sig', f'{base_name}-Windows.exe.sig'),
              ('-setup.exe', f'{base_name}-Windows.exe'),
              ('.dmg', f'{base_name}-MacOS.dmg'),
              ('.deb', f'{base_name}-Ubuntu.deb'),
          )
          staged = []
          for raw_path in artifact_paths:
              source = pathlib.Path(raw_path)
              if not source.is_file():
                  continue
              target_name = next(
                  (target_name for suffix, target_name in suffix_names if source.name.endswith(suffix)),
                  None,
              )
              if target_name is None:
                  print(f'Skipping non-release Tauri artifact: {source.name}')
                  continue
              target = destination / target_name
              if target.exists():
                  sys.exit(f'Duplicate staged release asset name: {target_name}')
              shutil.copy2(source, target)
              staged.append(target_name)

          if not staged:
              sys.exit('No release files were staged')
          print('Staged release assets:')
          print('\n'.join(sorted(staged)))
          PY

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-release-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Only this job gets write access; builds hand off signed files via artifacts.
  # Draft runs stop after uploading immutable assets; publishing the reviewed draft
  # is validated by publish-desktop-updater.yml without rebuilding.
  publish-release:
    name: Publish desktop release
    # Only prepare-version, so this starts alongside the build matrix and
    # queues for its runner during the build instead of after it. "Wait for the
    # build matrix" below restores the gate `needs: build` gave away. The cost
    # is one runner slot held for the length of the run.
    needs: [prepare-version]
    runs-on: ubuntu-latest
    # Waits out the build (the macOS leg caps at 180 now that it assembles,
    # signs and notarizes the bundled runtime; the other two still cap at 60)
    # then downloads and uploads. The publish steps themselves are 17-40s, but
    # the macOS .dmg went from tens of megabytes to ~600 MB, so the download and
    # the `gh release upload` are no longer instant either.
    timeout-minutes: 210
    permissions:
      contents: write      # create the versioned Release and replace updater-channel metadata
      actions: read        # the waiter reads this run's job list
      # Build provenance, and only here: the workflow-level default stays
      # `contents: read` and the build matrix keeps no permissions block at all,
      # so the job that already holds write scope is the one that signs for what
      # it publishes. `id-token: write` mints the short-lived OIDC token Sigstore
      # binds the attestation to; `attestations: write` stores the result.
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.prepare-version.outputs.app_version }}
      ASSET_VERSION: ${{ needs.prepare-version.outputs.asset_version }}
      PYPI_VERSION: ${{ needs.prepare-version.outputs.pypi_version }}
      STUDIO_VERSION: ${{ needs.prepare-version.outputs.studio_version }}
      DESKTOP_RELEASE_TAG: ${{ needs.prepare-version.outputs.desktop_release_tag }}

    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # Replaces the `needs: build` gate dropped above, and must be at least as
      # strict: publishing a partial release is far worse than publishing late.
      - name: Wait for the build matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # The three matrix legs, by their `name:` (Build <matrix.label>).
          LEGS=('Build macOS (Apple Silicon)' 'Build Linux (x64)' 'Build Windows (x64)')
          POLL=30
          # Longer than the longest leg's own cap (macOS, 180 minutes since the
          # bundled runtime), so a leg that is merely slow is waited out and only
          # a leg that has genuinely stopped reporting trips this. Shorter than
          # this job's 210, so the timeout is this explicit message rather than
          # the runner killing the job.
          DEADLINE=$(( $(date +%s) + 195 * 60 ))
          # Matrix job records appear with the run, so a leg still missing well
          # after the start is a real problem, not a slow API.
          STARTUP_DEADLINE=$(( $(date +%s) + 15 * 60 ))
          API_FAILS=0

          while :; do
            if ! JOBS="$(gh api --paginate \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
                  --jq '.jobs[] | [.name, .status, (.conclusion // "none")] | @tsv' 2>/dev/null)"; then
              # A blip in the jobs API must not throw away a finished build.
              API_FAILS=$(( API_FAILS + 1 ))
              if [ "$API_FAILS" -ge 10 ]; then
                echo "ERROR: jobs API failed 10 times running; cannot confirm the build matrix finished" >&2
                exit 1
              fi
              echo "jobs API call failed (${API_FAILS}/10); retrying in ${POLL}s"
              sleep "$POLL"
              continue
            fi
            API_FAILS=0

            MISSING=""
            PENDING=0
            BAD=""
            for leg in "${LEGS[@]}"; do
              ROW="$(printf '%s\n' "$JOBS" | awk -F'\t' -v n="$leg" '$1 == n {print; exit}')"
              if [ -z "$ROW" ]; then
                MISSING="${MISSING} '${leg}'"
                continue
              fi
              STATUS="$(printf '%s' "$ROW" | cut -f2)"
              CONCL="$(printf '%s' "$ROW" | cut -f3)"
              if [ "$STATUS" != "completed" ]; then
                PENDING=$(( PENDING + 1 ))
              elif [ "$CONCL" != "success" ]; then
                BAD="${BAD}${leg} (${CONCL}); "
              fi
            done

            # Fail on the first finished leg that did not succeed rather than
            # holding a runner to reach the same answer later.
            if [ -n "$BAD" ]; then
              echo "ERROR: refusing to publish, these build jobs did not succeed: ${BAD}" >&2
              exit 1
            fi
            if [ -n "$MISSING" ]; then
              if [ "$(date +%s)" -gt "$STARTUP_DEADLINE" ]; then
                echo "ERROR: no job record for:${MISSING}; refusing to publish without confirming they ran" >&2
                exit 1
              fi
              echo "waiting for job records to appear for:${MISSING}"
              sleep "$POLL"
              continue
            fi
            if [ "$PENDING" -eq 0 ]; then
              echo "all ${#LEGS[@]} build legs finished and succeeded"
              break
            fi
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then
              echo "ERROR: timed out waiting for the build matrix; ${PENDING} leg(s) still running" >&2
              exit 1
            fi
            echo "${PENDING} of ${#LEGS[@]} build legs still running; polling again in ${POLL}s"
            sleep "$POLL"
          done

      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: desktop-release-*
          path: ${{ runner.temp }}/desktop-release-assets
          merge-multiple: true

      - name: Download build input records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: desktop-build-inputs-*
          path: ${{ runner.temp }}/build-inputs
          merge-multiple: true

      # What the bundles were built from, as a release asset rather than a log
      # line: the toolchain versions, lockfile digests and pinned tool digests
      # currently exist only in runner logs, which expire while the binaries stay
      # downloadable forever. Deliberately not in the release notes -- those are
      # the maintainer's changelog and the updater popup renders them.
      #
      # The merge is also a check. All three legs report the commit they built
      # and the lockfiles they built with; a leg that disagrees built something
      # else, and that fails the release here rather than shipping a mixed set.
      - name: Assemble build-inputs.json
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys

          # The matrix legs by `artifact`, same hardcoded list as "Wait for the
          # build matrix" keeps by `label`. A record short of one leg would
          # describe a release only partly, and silently.
          EXPECTED_LEGS = {'macos-aarch64', 'linux-x64', 'windows-x64'}

          record_dir = pathlib.Path(os.environ['RUNNER_TEMP'], 'build-inputs')
          records = sorted(record_dir.glob('build-inputs-*.json'))
          if not records:
              sys.exit('No per-leg build input records were downloaded')

          platforms = {}
          for path in records:
              record = json.loads(path.read_text(encoding='utf-8'))
              key = record.pop('artifact')
              if key in platforms:
                  sys.exit(f'Duplicate build input record for {key}')
              platforms[key] = record

          if set(platforms) != EXPECTED_LEGS:
              sys.exit(
                  'Build input records do not cover the build matrix: '
                  f'missing={sorted(EXPECTED_LEGS - set(platforms))}, '
                  f'unexpected={sorted(set(platforms) - EXPECTED_LEGS)}'
              )

          # The macOS .dmg ships a complete Python runtime inside the app bundle.
          # A release whose record cannot say which one is a release whose runtime
          # is unauditable once the runner logs expire, so refuse to publish it.
          macos = platforms['macos-aarch64']
          bundled = macos.get('bundled_runtime') or {}
          if not bundled.get('manifest_sha256') or not bundled.get('manifest'):
              sys.exit(
                  'the macOS build input record carries no bundled runtime manifest, so the '
                  'release could not say what is inside the app bundle it publishes'
              )
          if bundled.get('signed_macho_count', 0) <= 0:
              sys.exit('the macOS build input record reports no signed Mach-O files')

          commits = {key: record['commit'] for key, record in platforms.items()}
          if len(set(commits.values())) != 1:
              sys.exit(f'Build legs did not all build the same commit: {commits}')
          lockfiles = {key: record['lockfiles'] for key, record in platforms.items()}
          if len({json.dumps(value, sort_keys=True) for value in lockfiles.values()}) != 1:
              sys.exit(f'Build legs did not all build from the same lockfiles: {lockfiles}')

          # Every leg reads these out of its own checkout of this workflow, so
          # disagreement means the legs were not running the same file.
          HOISTED = ('commit', 'source_date_epoch', 'lockfiles', 'pinned_actions', 'pinned_downloads')
          for field in HOISTED:
              values = {json.dumps(record[field], sort_keys=True) for record in platforms.values()}
              if len(values) != 1:
                  sys.exit(f'Build legs did not all agree on {field}: {sorted(values)}')

          shared = next(iter(platforms.values()))
          build_inputs = {
              'schema': 'unsloth-desktop-build-inputs/1',
              'studio_version': os.environ['STUDIO_VERSION'],
              'app_version': os.environ['APP_VERSION'],
              'pypi_version': os.environ['PYPI_VERSION'],
              'release_tag': os.environ['DESKTOP_RELEASE_TAG'],
              'commit': shared['commit'],
              'source_date_epoch': shared['source_date_epoch'],
              'lockfiles': shared['lockfiles'],
              'pinned_actions': shared['pinned_actions'],
              'pinned_downloads': shared['pinned_downloads'],
              'lockfile_digest_note': (
                  'SHA-256 over each file with CRLF normalised to LF, so the digest is the '
                  'same on all three runner platforms; on an LF checkout it equals sha256sum. '
                  'Cargo.lock is hashed after the release version patch, which rewrites the '
                  'unsloth-studio [[package]] version to app_version and nothing else.'
              ),
              'workflow': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'ref': os.environ.get('GITHUB_WORKFLOW_REF', ''),
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              },
              'platforms': {
                  key: {
                      name: value
                      for name, value in record.items()
                      # Hoisted above; per-leg copies are identical by the checks
                      # right up there and would only invite them to drift.
                      if name not in HOISTED
                  }
                  for key, record in sorted(platforms.items())
              },
          }

          asset_dir = pathlib.Path(os.environ['RUNNER_TEMP'], 'desktop-release-assets')
          out = asset_dir / 'build-inputs.json'
          out.write_text(json.dumps(build_inputs, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Validate release asset set
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import sys

          asset_dir = pathlib.Path(os.environ['RUNNER_TEMP'], 'desktop-release-assets')
          files = [path for path in asset_dir.iterdir() if path.is_file()]
          base_name = f'Unsloth-Desktop-{os.environ["ASSET_VERSION"]}'
          expected_names = {
              f'{base_name}-MacOS.dmg',
              f'{base_name}-ARM64.app.tar.gz',
              f'{base_name}-ARM64.app.tar.gz.sig',
              f'{base_name}-Linux.AppImage',
              f'{base_name}-Linux.AppImage.sig',
              f'{base_name}-Ubuntu.deb',
              f'{base_name}-Windows.exe',
              f'{base_name}-Windows.exe.sig',
              # Not prefixed Unsloth-Desktop-: that prefix is the republish
              # guard's namespace for bundles, and this is a per-release record,
              # not a bundle. It is validated, attested and uploaded with them.
              'build-inputs.json',
          }
          actual_names = {path.name for path in files}
          if actual_names != expected_names:
              missing = sorted(expected_names - actual_names)
              unexpected = sorted(actual_names - expected_names)
              sys.exit(
                  'Desktop release asset names do not match the branding contract: '
                  f'missing={missing}, unexpected={unexpected}'
              )
          print('\n'.join(sorted(actual_names)))
          PY

      # ── Build provenance attestation ──
      # Signs a SLSA provenance statement for every staged asset, binding each
      # file's digest to this repository, this workflow file, this commit and
      # this run, via a short-lived Sigstore certificate. Anyone can then check a
      # downloaded bundle against it:
      #
      #   gh attestation verify Unsloth-Desktop-...-MacOS.dmg --repo unslothai/unsloth
      #
      # which is the part code signing does not give: an Apple/Azure signature
      # says Unsloth signed this binary, this says which source and which
      # workflow run produced it. Runs after the asset set is validated, so
      # exactly the reviewed set is attested, and before the upload, so nothing
      # is published without one.
      #
      # Gated on a real publish: an attestation is a write to the repository's
      # attestation store, and a validation-only run must leave no trace.
      - name: Attest build provenance for the release assets
        if: ${{ !inputs.draft }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/desktop-release-assets/*

      # Validation runs before the scan so an already-used version is rejected
      # before any bundle is disclosed to VirusTotal. Creation remains deferred
      # until after the scan so a non-draft release is never left public and empty.
      - name: Validate versioned release state
        id: versioned_release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/desktop-release-notes.md"
          printf '%s\n' "$DESKTOP_RELEASE_NOTES" > "$notes_file"

          # The v{version} release already exists; re-checked here because the
          # read-scoped prepare-version token cannot see drafts.
          if ! gh api "repos/${GH_REPO}/releases/tags/${DESKTOP_RELEASE_TAG}" \
            > "$RUNNER_TEMP/target-release-publish.json" 2>/dev/null; then
            echo "Release ${DESKTOP_RELEASE_TAG} does not exist." >&2
            echo "  Tag main and publish it first, then re-dispatch this workflow." >&2
            exit 1
          fi
          # A carried-forward manifest for an older version is expected here (see
          # publish-desktop-updater.yml), so read it rather than judge by name alone.
          mkdir -p "$RUNNER_TEMP/target-manifest"
          gh release download "$DESKTOP_RELEASE_TAG" --pattern latest.json \
            --dir "$RUNNER_TEMP/target-manifest" --clobber 2>/dev/null || true
          python3 <<'PY'
          import json, os, pathlib, sys

          runner = pathlib.Path(os.environ['RUNNER_TEMP'])
          release = json.loads((runner / 'target-release-publish.json').read_text())
          tag = os.environ['DESKTOP_RELEASE_TAG']
          # Checked here, not at promotion: GitHub refuses to mark a prerelease
          # latest, and by then the bundles are already public.
          if release.get('prerelease'):
              sys.exit(f'Release {tag} is a prerelease; GitHub cannot mark it latest.')

          prefix = f'Unsloth-Desktop-{os.environ["ASSET_VERSION"]}'
          clashing = sorted(
              asset['name']
              for asset in release.get('assets', [])
              if str(asset.get('name', '')).startswith(prefix)
          )
          manifest_path = runner / 'target-manifest' / 'latest.json'
          if manifest_path.is_file():
              try:
                  version = json.loads(manifest_path.read_text()).get('version')
              except json.JSONDecodeError:
                  version = None
              # Only this version's own manifest is a clash; anything else is the
              # pointer being carried forward and is overwritten on upload.
              if not isinstance(version, str) or version.removeprefix('v') == tag.removeprefix('v'):
                  clashing.append('latest.json')

          if clashing:
              print(f'Refusing to republish {tag}: it already carries desktop assets.', file=sys.stderr)
              for name in clashing:
                  print(f'  gh release delete-asset {tag} {name} --yes', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Generate versioned updater metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import binascii
          import datetime
          import json
          import os
          import pathlib
          import sys
          import urllib.parse

          asset_dir = pathlib.Path(os.environ['RUNNER_TEMP'], 'desktop-release-assets')
          files = [path for path in asset_dir.iterdir() if path.is_file()]

          def exactly_one(suffix: str) -> pathlib.Path:
              matches = [path for path in files if path.name.endswith(suffix)]
              if len(matches) != 1:
                  sys.exit(f'Expected exactly one {suffix} updater asset, found {len(matches)}')
              return matches[0]

          def entry(signature_suffix: str) -> dict[str, str]:
              signature_path = exactly_one(signature_suffix)
              bundle_name = signature_path.name.removesuffix('.sig')
              bundle_path = asset_dir / bundle_name
              if not bundle_path.is_file():
                  sys.exit(f'Missing updater bundle for {signature_path.name}: {bundle_name}')
              signature_value = signature_path.read_text(encoding='utf-8').strip()
              try:
                  decoded_signature = base64.b64decode(signature_value, validate=True)
              except (binascii.Error, ValueError):
                  sys.exit(f'Invalid base64 updater signature: {signature_path.name}')
              if not decoded_signature.startswith(b'untrusted comment:') or b'\ntrusted comment:' not in decoded_signature:
                  sys.exit(f'Invalid minisign updater signature: {signature_path.name}')
              encoded_tag = urllib.parse.quote(os.environ['DESKTOP_RELEASE_TAG'], safe='')
              encoded_name = urllib.parse.quote(bundle_name, safe='')
              return {
                  'signature': signature_value,
                  'url': (
                      f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/'
                      f'{encoded_tag}/{encoded_name}'
                  ),
              }

          darwin = entry('.app.tar.gz.sig')
          linux = entry('.AppImage.sig')
          windows = entry('.exe.sig')
          notes = pathlib.Path(os.environ['RUNNER_TEMP'], 'desktop-release-notes.md').read_text()
          metadata = {
              'version': os.environ['APP_VERSION'],
              # App version is SemVer; this is the backend release it pins.
              'pypi_version': os.environ['PYPI_VERSION'],
              'notes': notes,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z'),
              'platforms': {
                  'darwin-aarch64': darwin,
                  'darwin-aarch64-app': darwin,
                  'linux-x86_64': linux,
                  'linux-x86_64-appimage': linux,
                  'windows-x86_64': windows,
                  'windows-x86_64-nsis': windows,
              },
          }
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'latest.json')
          output.write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      # The release body is the maintainer's changelog and this workflow never
      # rewrites it. The target release is already public, so a validation-only
      # run must not upload to it.
      - name: Publish versioned release assets
        if: ${{ !inputs.draft }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=()
          for asset in "$RUNNER_TEMP/desktop-release-assets"/*; do
            [[ "$asset" == *.sig ]] || release_assets+=("$asset")
          done
          # Preserve the published digests by refusing existing asset names.
          gh release upload "$DESKTOP_RELEASE_TAG" "${release_assets[@]}"

      - name: Publish versioned updater metadata
        if: ${{ !inputs.draft }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --clobber only for latest.json: it may already hold an older version's
          # pointer. The bundles above are still uploaded without it.
          gh release upload "$DESKTOP_RELEASE_TAG" "$RUNNER_TEMP/latest.json" --clobber

      - name: Download versioned updater metadata
        if: ${{ !inputs.draft }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-updater"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DESKTOP_RELEASE_TAG}" > "$RUNNER_TEMP/source-release.json"
          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys

          source = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'source-release.json').read_text())
          expected_tag = os.environ['DESKTOP_RELEASE_TAG']
          if source.get('tag_name') != expected_tag:
              sys.exit(f'Expected source release {expected_tag}, got {source.get("tag_name")}')
          if source.get('draft'):
              sys.exit(f'Source desktop release {expected_tag} is draft; refusing to publish public updater channel')
          PY
          gh release download "$DESKTOP_RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/desktop-updater" --clobber
          test -s "$RUNNER_TEMP/desktop-updater/latest.json"

      - name: Validate versioned updater metadata
        if: ${{ !inputs.draft }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          app_version = os.environ['APP_VERSION']
          release_tag = os.environ['DESKTOP_RELEASE_TAG']
          latest_path = pathlib.Path(os.environ['RUNNER_TEMP'], 'desktop-updater', 'latest.json')
          data = json.loads(latest_path.read_text())
          if not isinstance(data, dict):
              sys.exit('latest.json must be a JSON object')

          version = data.get('version')
          if not isinstance(version, str) or not version:
              sys.exit('latest.json missing version')
          if not re.fullmatch(r'v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?', version):
              sys.exit(f'latest.json version is not SemVer-like: {version}')
          if version.removeprefix('v') != app_version:
              sys.exit(f'latest.json version {version} does not match desktop app version {app_version}')

          platforms = data.get('platforms')
          if not isinstance(platforms, dict) or not platforms:
              sys.exit('latest.json missing platforms')

          required_families = {
              'darwin-aarch64': False,
              'linux-x86_64': False,
              'windows-x86_64': False,
          }
          expected_prefix = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{release_tag}/'
          forbidden_fragments = ('/releases/latest/', '/releases/download/desktop-latest/')

          for platform, entry in platforms.items():
              if not isinstance(entry, dict):
                  sys.exit(f'Platform {platform} must be an object')
              url = entry.get('url')
              signature = entry.get('signature')
              if not isinstance(url, str) or not url.strip():
                  sys.exit(f'Platform {platform} missing url')
              if not isinstance(signature, str) or not signature.strip():
                  sys.exit(f'Platform {platform} missing signature')
              if any(fragment in url for fragment in forbidden_fragments):
                  sys.exit(f'Platform {platform} points at a moving updater channel: {url}')
              if not url.startswith(expected_prefix):
                  sys.exit(f'Platform {platform} URL must point at {release_tag}: {url}')
              for family in required_families:
                  if platform == family or platform.startswith(family + '-'):
                      required_families[family] = True

          missing = [family for family, found in required_families.items() if not found]
          if missing:
              sys.exit('latest.json missing required platform families: ' + ', '.join(missing))
          PY

      - name: Promote normal release to GitHub latest
        if: ${{ !inputs.draft }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/source-release.json"
          release_id="$(python3 - "$release_json" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if release.get('draft'):
              sys.exit('Refusing to promote a draft release')
          if release.get('prerelease'):
              sys.exit('Desktop releases must be normal GitHub releases, not prereleases')
          release_id = release.get('id')
          if not isinstance(release_id, int):
              sys.exit('Published desktop release is missing its GitHub release id')
          print(release_id)
          PY
          )"

          # The prepare-version downgrade check ran before a build that can take an
          # hour, so re-read GitHub latest here: promoting past a newer release would
          # hand every client an older manifest.
          # Fail closed: a transient lookup failure must not read as "no newer
          # release". Only a genuine 404 means the repository has no latest yet.
          latest_before="$RUNNER_TEMP/latest-before-promote.json"
          latest_error="$RUNNER_TEMP/latest-before-promote.err"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "$latest_before" 2> "$latest_error"; then
            python3 - "$latest_before" <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          semver = re.compile(r'^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?$')

          def identifier(value):
              # beta10 must sort above beta2, so a trailing number compares as one.
              if value.isdigit():
                  return (0, '', int(value))
              tail = re.fullmatch(r'([A-Za-z-]+)(\d+)', value)
              if tail:
                  return (1, tail.group(1).lower(), int(tail.group(2)))
              return (1, value, -1)

          def key(tag):
              match = semver.fullmatch(tag or '')
              if not match:
                  return None
              major, minor, patch, pre = match.groups()
              # A prerelease sorts below the same release without one.
              return (
                  int(major), int(minor), int(patch), 0 if pre else 1,
                  [identifier(part) for part in pre.split('.')] if pre else [],
              )

          current = json.loads(pathlib.Path(sys.argv[1]).read_text()).get('tag_name')
          candidate = os.environ['DESKTOP_RELEASE_TAG']
          current_key, candidate_key = key(current), key(candidate)
          if current_key and candidate_key and current_key > candidate_key:
              sys.exit(f'Refusing to promote {candidate}: GitHub latest advanced to {current}.')
          PY
          elif grep -Fq '(HTTP 404)' "$latest_error"; then
            echo "No GitHub latest release yet; nothing to downgrade."
          else
            echo "Could not read GitHub latest; refusing to promote." >&2
            cat "$latest_error" >&2
            exit 1
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f make_latest=true > "$RUNNER_TEMP/promoted-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          python3 - "$RUNNER_TEMP/latest-release.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          latest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = os.environ['DESKTOP_RELEASE_TAG']
          if latest.get('tag_name') != expected:
              sys.exit(f'GitHub latest release is {latest.get("tag_name")}, expected {expected}')
          if latest.get('draft') or latest.get('prerelease'):
              sys.exit(f'GitHub latest release {expected} is not a normal published release')
          names = {asset.get('name') for asset in latest.get('assets', [])}
          if 'latest.json' not in names:
              sys.exit(f'GitHub latest release {expected} is missing latest.json')
          PY


  # ── Advisory multi-engine scan of the bundles just uploaded ──
  # Defender (build job) is one vendor and gates only Windows. VirusTotal
  # aggregates ~70 engines across all four bundles, which is how a false
  # positive from some other vendor gets noticed here rather than in a user bug
  # report. Advisory on purpose: installers routinely trip one or two obscure
  # heuristics, so a hard gate would block releases on noise. Defender stays the
  # authoritative fail-closed check.
  #
  # Its own job, after publish-release, because the scan is rate-limit bound and
  # not parallelisable: the free tier allows 4 requests/minute per key, so the
  # four bundles share one budget however they are scheduled. Inside the publish
  # job it was ~9 minutes of the ~9.5 the job took, delaying every release by its
  # full length while being unable to block one.
  virustotal-scan:
    # Not "post-publish": `inputs.draft` defaults to true and the release is
    # created with `--draft` on that input, so the ordinary run has uploaded the
    # assets to a draft. The name has to read true for both dispatches.
    name: VirusTotal release asset scan
    needs: [publish-release]
    runs-on: ubuntu-latest
    # A missing secret, a VirusTotal outage or quota exhaustion must not fail
    # the release whose assets are already uploaded.
    continue-on-error: true
    # Raised with the bundled runtime. scripts/virustotal_scan.py already uploads
    # through the signed-URL flow because "every desktop bundle is 41-46 MB",
    # which is over the 32 MB cap on POST /files; the macOS .dmg is now ~600 MB,
    # so that one upload alone is an order of magnitude slower than the whole scan
    # used to be. Nothing else changes: the job still cannot block a release, and a
    # .dmg that exceeds VirusTotal's 650 MB signed-URL ceiling degrades to an
    # annotated "unavailable" row rather than a failure.
    timeout-minutes: 60
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # Sparse: a full checkout to fetch one file would be wasteful.
      - name: Check out the scan script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/virustotal_scan.py
          sparse-checkout-cone-mode: false

      - name: Download published assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: desktop-release-*
          path: ${{ runner.temp }}/desktop-release-assets
          merge-multiple: true

      - name: VirusTotal scan
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          set -euo pipefail
          # Name the cause loudly: a silent failure here leaves the release
          # scanned by nothing but a terse "no summary" note.
          if [ ! -f scripts/virustotal_scan.py ]; then
            echo "::error::scripts/virustotal_scan.py is missing; the checkout step in this job must provide it"
            exit 1
          fi
          python3 scripts/virustotal_scan.py \
            "$RUNNER_TEMP/desktop-release-assets" \
            --output-markdown "$RUNNER_TEMP/virustotal-summary.md"

      - name: Publish VirusTotal summary
        if: always()
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/virustotal-summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            # Must stay byte-identical to SUMMARY_HEADING in
            # scripts/virustotal_scan.py, or a run that produced no summary shows
            # a second, unrelated section. A test ties the two together.
            echo '### VirusTotal release asset scan' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'The scan step produced no summary.' >> "$GITHUB_STEP_SUMMARY"
          fi
